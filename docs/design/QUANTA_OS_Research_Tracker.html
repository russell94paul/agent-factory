<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUANTA//OS Research Tracker</title>
<style>
  :root{
    --bg:#070D1F; --panel:#0E1733; --panel-2:#121C3D; --line:#1E2A55;
    --ink:#F3F6FF; --muted:#8B96B8; --blue:#2E8BFF; --violet:#9B4DFF; --cyan:#6EE7FF;
    --live:#2EE6A6; --dead:#FF4D6D; --amber:#FFB547;
    --grad:linear-gradient(90deg,#2E8BFF 0%,#4C63FF 50%,#9B4DFF 100%);
    --font:"Avenir Next","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
  body{min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(900px 500px at 12% -10%,rgba(46,139,255,.22),transparent 60%),
               radial-gradient(700px 400px at 95% 110%,rgba(155,77,255,.18),transparent 60%);}
  .app{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:20px 24px 60px}

  /* header */
  .top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .logo{height:52px;filter:drop-shadow(0 0 14px rgba(46,139,255,.45))}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:3px}
  .brand h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand p{margin:0;color:var(--muted);font-size:13px}
  .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;transition:border-color .15s,transform .08s}
  button:hover{border-color:#3A4A8A} button:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .primary{background:var(--grad);border:none;color:#fff;font-weight:700;box-shadow:0 0 22px rgba(76,99,255,.45)}
  .ghost{background:transparent}
  .saved{color:var(--muted);font-size:12px;align-self:center;min-width:70px;text-align:right}

  /* crucible funnel (the one bold element) */
  .crucible{margin:26px 0 18px;padding:22px 24px;border-radius:18px;background:linear-gradient(180deg,rgba(18,28,61,.9),rgba(14,23,51,.9));border:1px solid var(--line);position:relative;overflow:hidden}
  .crucible::after{content:"";position:absolute;inset:-1px;border-radius:18px;pointer-events:none;background:linear-gradient(90deg,rgba(46,139,255,.35),transparent 30%,transparent 70%,rgba(155,77,255,.35));mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px}
  .crucible h2{margin:0 0 4px;font-size:30px;font-weight:800;letter-spacing:-.3px}
  .crucible h2 b{color:var(--live);font-weight:800}
  .crucible p{margin:0 0 16px;color:var(--muted)}
  .funnel{display:flex;height:54px;border-radius:12px;overflow:hidden;background:#0A1230;border:1px solid var(--line)}
  .seg{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;transition:flex .6s cubic-bezier(.2,.8,.2,1);position:relative;font-weight:700;white-space:nowrap;overflow:hidden;cursor:pointer}
  .seg small{font-weight:500;color:rgba(255,255,255,.75)}
  .seg[data-s="open"]{background:#1B2A5E} .seg[data-s="proposed"]{background:#243B8A}
  .seg[data-s="testing"]{background:linear-gradient(90deg,#3159D9,#6B4BE8)}
  .seg[data-s="survived"]{background:linear-gradient(90deg,#14B88A,#2EE6A6);color:#04231A;box-shadow:inset 0 0 30px rgba(255,255,255,.25)}
  .seg[data-s="survived"] small{color:#0B4A38}
  .seg[data-s="killed"]{background:#3A1A2E;color:#FF8FA6}
  .seg:hover{filter:brightness(1.12)}
  .seg.active{outline:2px solid var(--cyan);outline-offset:-2px}

  /* filters */
  .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px}
  .chip.on{color:var(--ink);border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box}
  .chip .g{margin-right:6px}
  input[type=search],select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  input[type=search]{min-width:240px}

  /* board */
  .board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;align-items:start}
  .col{background:rgba(14,23,51,.65);border:1px solid var(--line);border-radius:16px;min-height:60vh;padding:12px;transition:background .15s,border-color .15s}
  .col.over{border-color:var(--cyan);background:rgba(46,139,255,.08)}
  .col header{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px 12px}
  .col header h3{margin:0;font-size:14px;font-weight:700}
  .col header em{font-style:normal;color:var(--muted);font-size:12px}
  .col[data-s="survived"] header h3{color:var(--live)} .col[data-s="killed"] header h3{color:#FF8FA6}
  .col[data-s="survived"]{box-shadow:inset 0 0 0 1px rgba(46,230,166,.25),0 0 40px rgba(46,230,166,.08)}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin-bottom:10px;cursor:grab;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s}
  .card:hover{border-color:#3A4A8A;transform:translateY(-1px)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.5}
  .card .k{position:absolute;right:10px;top:9px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:800}
  .k-slot{background:rgba(110,231,255,.15);color:var(--cyan)} .k-bet{background:rgba(155,77,255,.18);color:#C79BFF}
  .k-weak{background:rgba(255,181,71,.16);color:var(--amber)} .k-hybrid{background:rgba(46,230,166,.15);color:var(--live)}
  .card h4{margin:0 26px 6px 0;font-size:14px;font-weight:600;line-height:1.3}
  .card .meta{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:8px}
  .card .bar{height:4px;border-radius:4px;background:#1A2550;margin-top:9px;overflow:hidden}
  .card .bar i{display:block;height:100%;background:var(--grad)}
  .col[data-s="killed"] .card{opacity:.6}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);text-align:center;font-size:13px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(3,6,18,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .drawer .head{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .drawer .head h3{margin:0;font-size:16px;flex:1}
  .drawer .body{padding:16px 22px;overflow:auto;flex:1}
  .drawer .foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .field{margin-bottom:12px}
  .field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;font:inherit;background:#0A1230;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .field textarea{min-height:64px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;background:#0A1230;border:1px solid var(--line);border-radius:12px;padding:12px}
  .score label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:4px}
  .score label b{color:var(--ink)}
  .score input{width:100%;accent-color:#6B4BE8}
  .danger{color:#FF8FA6;border-color:#4A2138}
  .status-pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#0A1230;cursor:pointer;font-size:12px;color:var(--muted)}
  .pill.on{color:#fff;background:var(--grad);border-color:transparent}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:1100px){.board{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:720px){.board{grid-template-columns:1fr}.col{min-height:auto}.crucible h2{font-size:22px}.seg small{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

let cards=[],kindFilter="all",stageFilter="",sectionFilter="",q="",current=null,saveTimer=null,mem=null;
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}

async function load(){
  try{const r=await window.storage.get(KEY);if(r&&r.value){cards=JSON.parse(r.value);return}}catch(e){}
  cards=mem||JSON.parse(JSON.stringify(SEED));
}
function persist(){
  $("#saved").textContent="Saving…";clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{mem=cards;try{await window.storage.set(KEY,JSON.stringify(cards));$("#saved").textContent="Saved"}catch(e){$("#saved").textContent="Saved (this session)"}},400);
}
function score(c){const s=c.scores;return (s.novelty+s.defensibility+s.cost+s.fit)/40}
function visible(){return cards.filter(c=>(kindFilter==="all"||c.kind===kindFilter)&&(!stageFilter||c.status===stageFilter)&&(!sectionFilter||c.section===sectionFilter)&&(!q||(c.title+" "+c.target+" "+c.section+" "+c.mapping).toLowerCase().includes(q)))}

function render(){
  const counts=Object.fromEntries(STAGES.map(([k])=>[k,cards.filter(c=>c.status===k).length]));
  const inCr=counts.open+counts.proposed+counts.testing;
  $("#headline").innerHTML=`${cards.length} concepts tracked, <b>${counts.survived} survived</b>`;
  $("#subline").textContent=`${inCr} still in the Crucible, ${counts.killed} killed by their own falsification test.`;
  const f=$("#funnel");f.innerHTML="";
  STAGES.forEach(([k,l])=>{const s=el("div","seg"+(stageFilter===k?" active":""),`${counts[k]} <small>${l}</small>`);s.dataset.s=k;s.style.flex=Math.max(counts[k],0.6);s.onclick=()=>{stageFilter=stageFilter===k?"":k;render()};f.appendChild(s)});
  const sel=$("#sectionSel");const secs=[...new Set(cards.map(c=>c.section))].sort();const cur=sel.value;sel.innerHTML='<option value="">Every section</option>'+secs.map(s=>`<option ${s===cur?"selected":""}>${s}</option>`).join("");
  const b=$("#board");b.innerHTML="";const vis=visible();
  STAGES.forEach(([k,l])=>{
    const col=el("div","col");col.dataset.s=k;const items=vis.filter(c=>c.status===k);
    col.appendChild(el("header","",`<h3>${l}</h3><em>${items.length}</em>`));
    if(!items.length)col.appendChild(el("div","empty",k==="open"?"Nothing open. Add a concept or import her cards.":k==="survived"?"Nothing has survived yet.":"Drop a card here"));
    items.forEach(c=>{const d=el("div","card",`<span class="k ${KIND[c.kind][1]}">${KIND[c.kind][0]}</span><h4>${esc(c.title)}</h4><div class="meta"><span>${esc(c.section)}</span><span>${c.owner?esc(c.owner):""}</span></div><div class="bar"><i style="width:${Math.round(score(c)*100)}%"></i></div>`);
      d.draggable=true;d.dataset.id=c.id;d.onclick=()=>open(c.id);
      d.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",c.id);d.classList.add("dragging")});d.addEventListener("dragend",()=>d.classList.remove("dragging"));
      col.appendChild(d)});
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");const id=e.dataTransfer.getData("text/plain");const c=cards.find(x=>x.id===id);if(c&&c.status!==k){c.status=k;c.updated=today();persist();render();toast(`Moved to ${l}`)}});
    b.appendChild(col)});
}
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);

/* drawer */
const F=["title","section","target","computes","changes","prior","falsify","cost","risks","mapping","owner","notes"];
function open(id){
  current=id?cards.find(c=>c.id===id):S("New concept","slot","","open");
  F.forEach(k=>$("#f_"+k).value=current[k]||"");$("#f_kind").value=current.kind;$("#f_updated").value=current.updated;
  ["novelty","defensibility","cost","fit"].forEach(k=>{$("#s_"+k).value=current.scores[k];$("#v_"+k).textContent=current.scores[k]});
  $("#dTitle").textContent=id?"Concept card":"New concept";setKind();
  const sp=$("#f_status");sp.innerHTML="";STAGES.forEach(([k,l])=>{const p=el("span","pill"+(current.status===k?" on":""),l);p.onclick=()=>{current.status=k;[...sp.children].forEach(x=>x.classList.remove("on"));p.classList.add("on")};sp.appendChild(p)});
  $("#deleteBtn").style.display=id?"":"none";
  $("#drawer").classList.add("show");$("#scrim").classList.add("show");$("#f_title").focus();
}
function setKind(){const k=$("#f_kind").value;const d=$("#dKind");d.className="k "+KIND[k][1];d.textContent=KIND[k][0]}
function close(){$("#drawer").classList.remove("show");$("#scrim").classList.remove("show");current=null}
function save(){
  if(!current)return;F.forEach(k=>current[k]=$("#f_"+k).value.trim());current.kind=$("#f_kind").value;
  ["novelty","defensibility","cost","fit"].forEach(k=>current.scores[k]=+$("#s_"+k).value);current.updated=today();
  if(!current.title){toast("Give the concept a name");return}
  if(!cards.find(c=>c.id===current.id))cards.push(current);
  persist();render();close();toast("Saved")
}
$("#f_kind").onchange=setKind;
["novelty","defensibility","cost","fit"].forEach(k=>$("#s_"+k).oninput=e=>$("#v_"+k).textContent=e.target.value);
$("#saveBtn").onclick=save;$("#closeBtn").onclick=close;$("#scrim").onclick=close;
$("#deleteBtn").onclick=()=>{if(!current)return;if(!confirm("Delete this concept? This cannot be undone."))return;cards=cards.filter(c=>c.id!==current.id);persist();render();close();toast("Deleted")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

/* toolbar */
$("#addBtn").onclick=()=>open(null);
$("#exportBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:"application/json"}));a.download="quanta-tracker.json";a.click();toast("Exported")};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const arr=JSON.parse(r.result);const list=Array.isArray(arr)?arr:arr.cards||[];let n=0;list.forEach(x=>{const c=S(x.title||x.CONCEPT||"Untitled",(x.kind||"hybrid"),x.section||"",x.status||"proposed",x);if(!c.scores||typeof c.scores!=="object")c.scores={novelty:5,defensibility:5,cost:5,fit:5};if(!cards.find(y=>y.id===c.id))cards.push(c),n++});persist();render();toast(`Imported ${n} concepts`)}catch(err){toast("That file is not valid tracker JSON")}};r.readAsText(f);e.target.value=""};
$("#resetBtn").onclick=()=>{if(!confirm("Replace everything with the seed list from the guide?"))return;cards=JSON.parse(JSON.stringify(SEED));persist();render();toast("Reset to seed")};
document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));ch.classList.add("on");kindFilter=ch.dataset.kind;render()});
$("#sectionSel").onchange=e=>{sectionFilter=e.target.value;render()};
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};

load().then(()=>{render();$("#saved").textContent="";});
</script>
</body>
