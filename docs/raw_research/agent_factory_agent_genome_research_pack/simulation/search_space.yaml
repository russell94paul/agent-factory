apiVersion: agentfactory.ai/v1alpha1
kind: AgentSearchSpace

scope: single_agent_v1

parameters:

  model.reasoning_effort:
    type: categorical
    values: [low, medium, high, adaptive]

  cognition.planning.strategy:
    type: categorical
    values: [reactive, plan_then_execute, rolling_horizon, hierarchical]

  cognition.planning.horizon:
    type: integer
    min: 2
    max: 12

  cognition.reasoning.verification_tendency:
    type: float
    min: 0.2
    max: 1.0

  cognition.reasoning.self_critique_frequency:
    type: float
    min: 0.0
    max: 1.0

  cognition.reasoning.exploration_rate:
    type: float
    min: 0.05
    max: 0.65

  cognition.recovery.ask_for_help_threshold:
    type: float
    min: 0.3
    max: 0.9

  context.retrieval.top_k:
    type: integer
    min: 5
    max: 60

  context.retrieval.relevance_min:
    type: float
    min: 0.45
    max: 0.90

  context.retrieval.freshness_weight:
    type: float
    min: 0.0
    max: 0.5

  context.retrieval.provenance_weight:
    type: float
    min: 0.0
    max: 0.5

  memory.organizational.publish_threshold:
    type: float
    min: 0.55
    max: 0.95

  communication.initiative:
    type: float
    min: 0.05
    max: 0.95

  communication.unsolicited_message_probability:
    type: float
    min: 0.0
    max: 0.8

  communication.verbosity_target:
    type: float
    min: 0.10
    max: 0.85

  communication.novelty_threshold:
    type: float
    min: 0.40
    max: 0.95

  communication.broadcast_threshold:
    type: float
    min: 0.50
    max: 0.98

  communication.challenge_propensity:
    type: float
    min: 0.0
    max: 1.0

  collaboration.delegation_tendency:
    type: float
    min: 0.0
    max: 1.0

  collaboration.peer_review_tendency:
    type: float
    min: 0.0
    max: 1.0

  behavioral_parameters.caution:
    type: float
    min: 0.1
    max: 0.95

  behavioral_parameters.persistence:
    type: float
    min: 0.2
    max: 0.95

  runtime.max_turns:
    type: integer
    min: 6
    max: 30

  runtime.budget.soft_usd:
    type: float
    min: 0.5
    max: 10.0

constraints:
  - "communication.broadcast_threshold >= communication.novelty_threshold - 0.10"
  - "runtime.budget.soft_usd <= runtime.budget.hard_usd"

freeze_until_later:
  - authority.*
  - doctrine.*
  - permissions.*
  - organization.topology
  - relationship.*
