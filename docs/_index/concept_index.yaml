- concept_id: C-TM-06
  name: Goal-aware adaptive/dynamic orchestration
  aliases: [dynamic critical path, deadline-aware scheduling, event-driven replanning, elastic team composition, scope degradation]
  description: >-
    ⚠ AN OPERATOR-PROPOSED DIRECTION, RECORDED 2026-09-02, NOT DESIGNED AND NOT ENDORSED. An
    orchestrator that holds a goal contract with a deadline, recomputes the critical path as
    evidence arrives, reprioritises and replans on events and failures, sizes teams to demand,
    schedules against rationed resources, gates humans dynamically, detects goal drift, and
    degrades scope as a deadline approaches.
  source_documents:
    - "operator planning, 2026-09-02 (no document; recorded here so the idea has an id and a prior-art record before anything is built)"
  prior_art:
