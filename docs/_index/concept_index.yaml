- concept_id: C-AG-09
  name: SIHRE cognitive kernel and morphological cognition
  aliases: [heterogeneous reasoning governance, mutable cognition, cognitive architecture generator]
  description: >-
    Heterogeneous reasoning governance INSIDE one agent — routing between reasoning modes plus trust
    plus uncertainty plus verification. Morphological cognition extends it: the agent constructs a
    different cognitive topology per mission rather than running a fixed planner/reviewer pipeline.
    Recursive SIHRE applies the same routing and trust principles at expert, agent, team, army and
    factory levels.
  source_documents:
