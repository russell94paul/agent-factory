- concept_id: C-GV-01
  name: The isolation ladder — tier chosen by what the task touches
  aliases: [T0/T1/T2, isolation by verb not by role, the dangerous verb is contained by construction]
  description: >-
    An agent's isolation tier is chosen by WHAT ITS TASK TOUCHES, declared up front and enforced —
    not by what kind of agent it is. T0 git worktree, repo files only, no network egress, no DB
    verbs. T1 container with an egress allowlist and a read-only warehouse role: repo plus SELECT on
    real data. T2 container plus an EPHEMERAL ZERO-COPY CLONE SCHEMA dropped on exit: full DDL/DML
    inside the clone only. An agent that asks for a verb its tier does not carry is REFUSED, and the
    refusal is an audit event.
  source_documents: [docs/specs/architecture-v0.md, docs/research/answers/R3-answer-control-plane.md, docs/research/answers/R17-answer-data-engineering-external-survey.md, docs/research/answers/R18-answer-our-factory-internal-audit.md]
