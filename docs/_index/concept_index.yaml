- concept_id: C-CM-04
  name: Communication-defect attribution requires naming the upstream record
  aliases: [what makes a defect communication-caused, the three conditions]
  description: >-
    A defect is communication-caused only when ALL THREE hold: the information existed upstream and
    was RECORDED SOMEWHERE at handoff time; it was absent, wrong-versioned or mis-stated in the
    envelope; and had it been correct the receiver's action would have differed, as a falsifiable
    counterfactual. If the information was never recorded anywhere, it is an implementation or
    analysis defect, NOT a communication defect.
  source_documents: [docs/protocol/METRICS.md]
  maturity: designed
  research_status: not_researched
  implementation_status: DESIGN_ONLY
  related_concepts: [C-CM-03, C-VD-02, C-EV-06]
  dependencies: [C-CM-03]
  proposed_benefits:
