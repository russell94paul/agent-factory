- concept_id: C-PR-08
  name: Mine the mechanism, never the identity
  aliases: [pattern extraction policy, reference implementation mining, ADOPT_CONCEPT/ADAPT/EXPERIMENT/REJECT]
  description: >-
    A reference implementation is read for the MECHANISM and never for the artefact — licence
    first, then architecture, then feature by feature, each classified ADOPT_CONCEPT / ADAPT /
    EXPERIMENT / REJECT with its provenance recorded. Product identity, UI, branding, prompts and
    code are explicitly out of scope. ⭐ The corollary that makes it pay: a mined pattern that lets
    you DELETE a subsystem is worth more than one that adds a feature, and the defects of the
    mined repo transfer as readily as its virtues, so they are recorded and inverted rather than
    inherited.
  source_documents:
    - .agent-platform/bootstrap/docs/PATTERN_EXTRACTION_POLICY.md
    - .agent-platform/bootstrap/docs/REFERENCE_IMPLEMENTATIONS.md
    - .agent-platform/bootstrap/skills/reference-implementation-miner/SKILL.md
    - .agent-platform/RECONCILIATION.md
