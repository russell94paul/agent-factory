- concept_id: C-RS-01
  name: The neighbours table — every pass names what it must NOT answer
  aliases: [pass borders, do not answer thinly, a named handoff beats a thin answer]
  description: >-
    The expensive failure in a research programme is two passes answering the same question
    differently, which costs a run and then costs a reconciliation. Every prompt from R12 onward
    carries a table naming what it OWNS and what it MUST NOT ANSWER, and every prompt is told: if a
    question belongs to a neighbour, say so and stop.
  source_documents: [docs/research/README.md, docs/research/R13-architecture-and-ui-survey.md, docs/research/R14-structure-model-and-joy.md, docs/research/R15-source-corpus-crawl.md, docs/research/R17-data-engineering-external-survey.md]
