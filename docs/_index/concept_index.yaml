- concept_id: C-GV-07
  name: The execution surface is a routing constraint, not a second scheduler
  aliases: [execution surface policy, remote_control vs cloud_web, surface selection, task execution metadata]
  description: >-
    A task declares what it needs from the machine it runs on — local files, local MCP servers,
    local secrets, an isolated worktree, whether it may run beside anything else, and which paths
    it writes — and the surface is CHOSEN from that declaration rather than assumed. "Claude
    session" is not one uniform runtime: a local Remote Control session, a cloud web session and a
    detached worktree differ in what they can reach, and a task placed on the wrong one fails for
    a reason that looks like an agent defect. The collision rule is the load-bearing half — two
    tasks may run at once only when both are read-only, or they hold separate worktrees, or a
    deterministic lock proves their mutable resources are disjoint. "The agents will coordinate"
    is not a locking strategy.
  source_documents:
    - .agent-platform/bootstrap/docs/EXECUTION_SURFACE_POLICY.md
    - .agent-platform/bootstrap/docs/WEB_REMOTE_SESSION_RUNBOOK.md
    - .agent-platform/PACK_CONFORMANCE.md
  maturity: designed
  research_status: not_researched
  implementation_status: NOT_IMPLEMENTED
  implementation_evidence: >-
    ⛔ MEASURED ZERO, from an instrument shown able to see the term elsewhere:
    `grep -rniE "remote_control|cloud_web|preferred_surface|execution_surface" factory/ scripts/ blueprints/ missions/ | wc -l`
