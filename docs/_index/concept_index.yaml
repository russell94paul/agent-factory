  research_status: answered_and_contested
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/lanes.py:125 LANES; factory/worktrees.py one worktree per lane; factory/claims.py dynamic mutual exclusion with O_EXCL locks verified against the process table"
  related_concepts: [C-TM-01, C-GV-01, C-CM-02]
  dependencies: []
  proposed_benefits: ["structural isolation of parallel sessions; conflicts become impossible rather than merely rare"]
  proposed_metrics: ["cross-lane conflict count (MEASURED: 3 lanes, 20 commits, ZERO conflicts)"]
  evidence:
    for: ["MEASURED here: zero cross-lane conflicts across 3 lanes and 20 commits", "R5 and R6 reached worktree-per-lane independently"]
    against:
      - "⚠ R5's supporting figure — 41.7% cross-agent PR conflict rate over ~33,000 PRs — was flagged by R17 as 'a citation wearing a measurement's clothes'. SYNTHESIS §16.1 ran the discriminating test. Read §16.1 before quoting it."
  unresolved_questions:
    - "⭐ architecture-v0 §7.2: 'data work does not conflict' is ASSERTED, not measured. Two agents building two views can conflict on a shared dimension table or a naming convention. The conflict graph may need DIFFERENT EDGES, not fewer."

