  description: >-
    A durable, addressable, reviewed record of a premise that turned out to be wrong. Four mandatory
    fields — BELIEVED (the premise as another lane would state it, in their words), ACTUALLY (what
    is true), MEASURED BY (the discriminating test, so a reader can re-run it rather than trust
    you), AFFECTS (the lanes, gates or files that inherit the premise). Three optional fields —
    KIND, CHANGES (mandatory for a design finding), STATUS. Routed to the lanes it hits, and merged
    with the branch.
