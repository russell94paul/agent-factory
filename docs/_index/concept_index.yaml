- concept_id: C-AG-16
  name: The capability record — a claim bound to the conditions it was measured under
  aliases: [certified agent/team registry, evidence-backed capability, certification envelope, validity window]
  description: >-
    What an agent or team can do is recorded as a claim PLUS the envelope the claim was measured
    in — exact config/version identity, task family, the conditions, how many pieces of evidence
    and where they are, success and regression history, cost, latency, and a validity window after
    which the claim expires. A capability asserted without its conditions invites the runtime to
    use it outside the envelope it was graded in.
