  unresolved_questions:
    - "⚠ One artefact from the 2026-08-31 mining has no in-repo home and lives only in the wiki. A mined conclusion outside every gate is invisible to every gate."
  delta_disposition_2026_09_02: PROMOTE_AS_NEW_CONCEPT
  preservation_note: >-
