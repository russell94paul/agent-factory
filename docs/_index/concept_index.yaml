    - "α(G)/maximum-independent-set ceiling and Dilworth width, SYNTHESIS.md:1380-1394 [A-24 verified, A-25, A-26, A-27]"
    - "Contract Net and auction MAS — SYNTHESIS.md: 'auctions solve assignment UNDER UNCERTAINTY about capability or cost; with a known static graph and homogeneous agents there is nothing to discover' [A-58, A-59]"
    - "anytime algorithms and deliberation scheduling (1988); speculative execution; planning horizons — via the sibling's R01 Deliverable 4, which rates Temporal Echelons the ONLY LOW novelty risk in a 15-concept map"
  prior_art_status: known_prior_art
  prior_art_note: >-
    ⛔ NO NOVELTY IS CLAIMED, AND THE CORPUS CONSTRAINS THIS CONCEPT HARD. Twelve of the fourteen
    named sub-ideas have prior art on file; four are ALREADY BUILT here (see below); one (goal drift)
    exists in this corpus only as a two-occurrence quotation naming it a failure mode of hierarchy,
    with no detector and no metric; and exactly one — SCOPE DEGRADATION AS A DEADLINE APPROACHES —
    has ZERO occurrences in either repository and is the only genuinely unrepresented member.
    ⭐ THE DECISIVE CONSTRAINT: reordering fixed work cannot beat T-infinity. Any version of this
    concept that leaves the goal fixed and reorders execution is already known to be bounded. The
    version that is NOT bounded is one that MUTATES the graph — changing scope, evidence
    requirements or gates. A design that does not say which side of that line it sits on cannot be
    evaluated.
  maturity: idea
  research_status: not_researched
  implementation_status: PARTIAL
