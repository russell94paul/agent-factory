- concept_id: C-TM-07
  name: The Mission Assembly Plan — a compiled team, resolved before anything runs
  aliases: [mission assembler, conditional swarming, availability vector, resolved assembly plan]
  description: >-
    A mission compiles through a deterministic sequence before execution — task family and risk,
    then required capabilities, then prior experts, then who is actually available, then topology
    candidates, then communication and context routes, then budget/authority/gates — and the
    OUTPUT is a durable object (participants, routes, context packets, budget, gates, evaluation
    contract) rather than a decision made inside stage code. Two refinements travel with it.
    SWARMING IS CONDITIONAL — a temporary swarm forms only for parallel exploration, diverse
    expertise or independent verification, never as the default shape. And AVAILABILITY IS NOT
    IDLE/BUSY — it is load, tool and environment access, cost lane, latency expectation, recent
    relevant experience, health, budget remaining and permission scope.
  source_documents:
    - .agent-platform/bootstrap/docs/MISSION_ASSEMBLY_AND_SWARMING.md
