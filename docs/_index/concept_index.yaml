  implementation_evidence: "T0 is built (factory/worktrees.py, factory/deploy.py with turn and dollar caps and a persisted AttemptLedger). T1 and T2 do not exist."
  related_concepts: [C-TM-03, C-GV-02, C-GV-05, C-EV-06]
  dependencies: []
  proposed_benefits:
