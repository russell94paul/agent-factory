- concept_id: C-AG-11
  name: Cognitive error correlation and cognitive portfolio optimization
  aliases: [error covariance between agents, portfolio selection of experts]
  description: >-
    Select agents or experts by expected utility AND ERROR COVARIANCE, not by individual accuracy —
    so that a team's diversity actually reduces correlated failure rather than merely adding
    members. Requires measuring WHICH AGENTS FAIL TOGETHER.
