  related_concepts: [C-OR-06, C-TM-03, C-TM-04, C-EV-01, C-GV-03, C-EV-08, C-OR-04]
  dependencies: [C-EV-01]
  proposed_benefits: unknown
  proposed_metrics: unknown
  known_risks:
    - "⛔ Wave 0's type argument forbids the obvious implementation: authority, budget and deadline are `Mandate`, not `Contract`. 'A GreenContract's fold is meaningful only because every member is falsifiable; adding permissions breaks the property the object exists for.' Adopt the three-way split Contract / Mandate / Task."
