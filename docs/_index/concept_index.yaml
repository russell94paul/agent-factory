- concept_id: C-CM-01
  name: The durable record and the live channel are different things
  aliases: [record vs channel, findings.d vs the bus, one file per writer]
  description: >-
    A permanent ledger and a live inter-agent channel cannot be the same file. The record is
    append-only, in git, one FILE per entry so separate paths cannot conflict. The channel is
    ephemeral, machine-local, gitignored, one file PER WRITER, with read cursors and re-delivery on
    crash — and a lane never writes another lane's file.
  source_documents:
    - docs/agent-communication.md
    - factory/bus.py
    - docs/findings.d/README.md
    - docs/findings.d/F70-a-shared-ledger-cannot-survive-parallel-lanes.md
    - docs/findings.d/F71-lanes-still-cannot-see-each-other-live.md
  maturity: measured
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/bus.py:48 KINDS = (correction, claimed, blocked, finished, note), rejected at bus.py:74; docs/findings.d/ one file per finding; factory/findings.py reads the ledger as data"
  related_concepts: [C-CM-02, C-CM-03, C-KN-01, C-TM-03]
  dependencies: [C-TM-03]
  proposed_benefits: ["worktree isolation stays a feature instead of destroying the ledger"]
  proposed_metrics: ["messages delivered vs written (the read path is the load-bearing half)"]
  measured_origin: >-
    On 2026-08-22 three isolated worktrees each appended their own F11 and F12 to one file. Each
    read F10 as the last id and took the next number — correctly, independently, and incompatibly.
    A merge would have silently destroyed two of each, in the file whose entire job is stopping a
    lane from paying twice for the same mistake.
  unresolved_questions:
    - "⛔ F71 is OPEN: fragments fix the merge, not the blindness. Lanes still cannot see each other live."
    - "⚠ CURRENT_STATE.md: two typed event systems exist and NEITHER is an organizational event log. There is no durable, replayable, cross-entity event stream."

- concept_id: C-CM-02
  name: Claims — dynamic mutual exclusion verified against the process table
  aliases: [lane claiming, a claim is not a process]
  description: >-
    A static conflict map is advice; advice does not stop a second session opening the same file.
    Claims are the dynamic half: an exclusive lock recording who actually started a lane. Liveness
    is checked against THE PROCESS TABLE, not the existence of a registry file, because the file
    outlives the process. Stale claims still block, because hiding them makes a blocked lane look
    free.
  source_documents:
    - factory/claims.py
    - factory/sessions.py
    - docs/findings.d/F73-a-claim-is-not-a-process.md
    - docs/research/answers/R12-answer-session-manager-ui.md
  maturity: measured
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/claims.py O_EXCL locks; factory/sessions.py reads Claude Code's own registry and verifies against the process table; tests/test_claim_race.py, tests/test_contention.py"
  related_concepts: [C-CM-01, C-TM-03, C-UI-04]
  dependencies: [C-TM-03]
  proposed_benefits: ["two agents cannot silently work the same lane"]
  proposed_metrics: ["duplicate-start refusals; refusals later shown legitimate"]
