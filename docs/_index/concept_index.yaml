- concept_id: C-EV-10
  name: The counterfactual maturity ladder — EXERCISED / IMPLEMENTED_NOT_EXERCISED / SIMULATED / PROPOSED
  aliases: [counterfactual honesty, a capability that cannot point at its own implementation, simulated is not proven]
  description: >-
    ⭐ THE REPOSITORY'S OWN VOCABULARY FOR "WHAT IS BUILT VERSUS WHAT IS PROPOSED", enforced by a
    type rather than by a convention. Four maturities: EXERCISED — it ran, against this delivery,
    and we saw it; IMPLEMENTED_NOT_EXERCISED — the code exists and nothing has run it here;
    SIMULATED — designed, not built; PROPOSED — named, not designed. Three enforcement rules:
    (1) EXERCISED or IMPLEMENTED_NOT_EXERCISED with no `mechanism_refs` (module:line) RAISES —
    "a capability that cannot point at its own implementation is a proposal wearing a build's
    label"; (2) EXERCISED with no `exercised_proof` RAISES — naming the code shows it exists, it
    does not show it RAN; (3) anything below EXERCISED has its `basis` FORCED to SIMULATED,
    "whatever the authored file said". The dataclass deliberately has no `status` and no
    `grounding` field, so it is not duck-type-compatible with a delivered outcome and CANNOT be
    passed to the component that renders one — the rule "a SIMULATED capability must not be
    rendered in the same visual register as an observed one" is enforced by the type.
  source_documents:
    - factory/assertions.py
    - factory/case_study.py
    - factory/case_study_render.py
    - docs/design/artifact-generator-proposal.md
  maturity: measured
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/assertions.py MATURITIES + Counterfactual.__post_init__ + is_observed; factory/case_study_render.py:274 renders the SIMULATED caveat; tests/test_case_study.py"
  related_concepts: [C-VD-01, C-VD-03, C-GV-04, C-EV-06, C-PR-01]
  dependencies: [C-VD-03]
  proposed_benefits:
    - "a proposal cannot acquire a build's label by being described confidently"
    - "the separation is a TYPE property, not a reviewer's vigilance"
  proposed_metrics:
    - "capabilities EXERCISED / total capabilities claimed (case_study_render.py:490 publishes exactly this ratio in the artifact)"
  unresolved_questions:
