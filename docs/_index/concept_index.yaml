- concept_id: C-TM-01
  name: One worker, a non-LLM verifier, and a human for privileged operations
  aliases: [the minimum topology, single-worker blueprint]
  description: >-
    The team shape this repository decided on: exactly one working agent, a DETERMINISTIC (non-LLM)
    verifier that owns the verdict, and a human for anything privileged. Additional LLM roles are
    deferred behind quantified unlock conditions.
  source_documents:
    - docs/research/answers/R2-answer-topology.md
    - docs/research/SYNTHESIS.md
    - README.md
    - blueprints/orchestrator_team.yaml
  maturity: measured
  research_status: answered_and_contested
  implementation_status: IMPLEMENTED
  implementation_evidence: "no LLM judge exists anywhere in the codebase; every verdict is deterministic Python (PACK_CONFORMANCE.md test 1.2). factory/provider.py:11-13: 'a provider never names its own verdict'."
  related_concepts: [C-TM-02, C-TM-03, C-EV-02, C-AG-11]
  dependencies: [C-VD-01]
  proposed_benefits: ["removes the seam cost that our own measured failures were all at"]
  proposed_metrics: ["terminal success rate; cost per accepted outcome; handoff acceptance rate"]
  evidence:
    for:
      - "sequential tasks degrade up to -70.0% under multi-agent architectures (arXiv:2512.08296 v3, named in the paper's own abstract). Connector migration is sequential shared-state work."
      - "architectures WITHOUT centralized verification propagate errors more than those with it — an independent argument for the non-LLM verifier already built"
      - "our own measured failures were all at SEAMS, so adding two mandatory LLM-to-LLM handoffs treats the wrong variable"
    against:
      - "⚠ the headline -3.5% mean carries a 95% interval of -18.6% to +25.7%. An interval spanning zero is NOT evidence that coordination hurts on average — it is evidence of high variance and no detectable average effect."
      - "the same study found a centralised system improved a PARALLELISABLE financial task by +80.9%. The effect is strongly task-structure dependent, in both directions."
      - "the source labels itself OPEN RESEARCH, not production infrastructure evidence"
  unresolved_questions:
    - "the decision stands on sequential degradation and on our own seam failures, NOT on the aggregate mean. Anyone re-opening it should attack those two, not the -3.5%."

- concept_id: C-TM-02
  name: Unlock conditions — deferral with a quantified threshold
  aliases: [the deliberate-absence table, the do-not-build list, rank promotion rules]
  description: >-
    Every deliberately absent subsystem carries a NAMED, QUANTIFIED condition that would unlock it.
    Optimizer <- a working eval. Agent Army / supervisor tiers <- one certified team plus evidence a
    tier helps. A second comms topology <- a second team that actually needs to talk to the first.
    Gym <- the eval corpus plus a scoreboard. Platform UI <- numbers worth looking at. And in
    SYNTHESIS §6, ten more with pass-percentage and sample-size thresholds.
  source_documents:
    - README.md
    - docs/research/SYNTHESIS.md
    - blueprints/orchestrator_team.yaml
    - docs/DEEP-REVIEW-PROMPT.md
  maturity: implemented
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "the table is enforced socially rather than mechanically; docs/research/agent-factory-concept-inventory.md §1 makes DEFERRED a first-class survey verdict so a gap analysis cannot report a deferral as a gap"
  related_concepts: [C-TM-01, C-OR-04, C-SI-01, C-PR-04]
  dependencies: []
  proposed_benefits: ["a survey run without this list reports every deferral as a gap and is wrong once per row"]
  proposed_metrics: ["for each row: has its unlock evidence been produced?"]
  unresolved_questions:
    - "no mechanism re-checks an unlock condition when new evidence arrives; the concept inventory §5.4 asks for exactly that and nothing does it"
  competing_formulation:
    - concept: "rank progression (.agent-platform/bootstrap/ROADMAP_TO_VISION.md)"
      note: "encodes the same discipline as an ordered ladder with promotion rules rather than a table of independent gates. Neither document cites the other. Compare them — the ladder is easier to communicate, the table is harder to game."

- concept_id: C-TM-03
  name: Parallelism bound by file locality, not by the dependency graph
  aliases: [the conflict graph, lanes, worktree per lane]
  description: >-
    What can START is a dependency question. What can run IN PARALLEL is a FILE question: two agents
    editing the same file conflict regardless of the DAG. `conflicts()` computes which lanes write
    the same files, and the concurrency ceiling is the maximum independent set of that graph.
  source_documents:
    - factory/lanes.py
    - factory/worktrees.py
    - docs/specs/architecture-v0.md
    - docs/research/answers/R5-answer-build-velocity.md
    - docs/research/answers/R6-answer-automation-and-alerting.md
