# Concept index — named and unnamed ideas in the Agent Factory corpus
#
# GENERATED 2026-09-02 against agent-factory @ fc78074 (main).
# AMENDED 2026-09-02 @ 7b19baf (main) by the .agent-platform delta pass — Section P, nine concepts.
#   Its reconciliation, including the six mechanisms deliberately given NO id, is in
#   docs/_index/agent_platform_delta_synthesis.md. Nothing above Section P was rewritten.
# Companion to corpus_manifest.yaml (per-artifact records) and document_catalog.md (reading map).
#
# ------------------------------------------------------------------------------------------------
# RULES THIS INDEX FOLLOWS
# ------------------------------------------------------------------------------------------------
#
# 1. SPECULATIVE CONCEPTS ARE PRESERVED. A concept is not downgraded for being unusual, unproven or
#    metaphorical. `maturity` and `evidence` say what is known; they do not say whether the idea is
#    good. Several of the most speculative entries here (C-AG-11 cognitive error correlation,
#    C-AG-13 expected verification value) carry the highest research value in the index precisely
#    because they are testable against data this repository already holds.
#
# 2. A CONCEPT'S HOME IS ITS FIRST NAMED SOURCE, not its best treatment. Where a later document
#    treats it better, that document is listed second and the relationship is stated.
#
# 3. `implementation_status` claims are subordinate to docs/agent-army/CURRENT_STATE.md, which
#    cites file:line. Where they disagree, CURRENT_STATE.md is right.
#
# 4. NOTHING IS INVENTED. A concept with no stated benefit, no proposed metric or no source has
#    those fields as `unknown` or absent. Several entries below have `proposed_metrics: unknown`
#    and that is a finding about the corpus, not an omission in this index.
#
# 5. UNNAMED CONCEPTS ARE INCLUDED. Section H holds ideas the corpus practises without ever giving
#    them a name. They are among the most transferable things in it, and none of the inbound
#    research packs contains any of them.
#
# ------------------------------------------------------------------------------------------------

schema_version: 1

id_scheme:
  format: "C-<AREA>-<NN>"
  areas:
    VD: verdict and measurement semantics
    AG: agent — definition, configuration, cognition
    TM: team and topology
    OR: organization, hierarchy, higher-order structures
    CM: communication and coordination
    KN: memory, knowledge and context
    EV: evaluation, contracts and gates
    OP: optimization and search
    SM: simulation
    SI: self-improvement and self-maintenance
    GV: governance, safety and autonomy boundaries
    UI: operator surfaces
    RS: the research system itself
    PR: process and working discipline
  stability: "IDs are stable. A concept that is later split keeps its id for the parent and gains C-<AREA>-<NN>a/b children."

maturity_vocabulary:
  - idea               # named, no design
  - designed           # a design document exists
  - specified          # a contract, schema or spec exists
  - prototyped
  - implemented        # exists, imported, covered by a test
  - measured           # implemented AND a number has been obtained from it in this estate
  - refuted            # tested here or in cited work, and the result was against it

research_status_vocabulary:
  - not_researched
  - prompt_written_not_dispatched
  - answered_unverified      # an answer exists; nobody checked it back to source
  - answered_verified        # an answer exists and its load-bearing claims were checked
  - answered_and_contested   # an answer exists and a later pass or measurement disputes it
  - settled

concepts:

# ================================================================================================
# A · VERDICT AND MEASUREMENT SEMANTICS
#     The corpus's deepest layer. Every other concept is judged through it.
# ================================================================================================

- concept_id: C-VD-01
  name: The five verdicts, never collapsed
  aliases: [five-verdict contract, GreenContract verdicts, PASS/FAIL/UNMEASURABLE/ERROR/NOT_RUN]
  description: >-
    A check returns one of five verdicts and no two may be merged. PASS asserted and held; FAIL
    asserted and did not hold; UNMEASURABLE the instrument declined to run and KNOWS it cannot look;
    ERROR the apparatus itself broke, which is not a measurement at all; NOT_RUN never attempted.
    ERROR dominates FAIL: once the apparatus has broken we no longer know the observed failure was
    real. Collapsing "I could not look" into "I looked and it was fine" is how a measurement that
    never happened passes for one that did.
  source_documents:
    - README.md
    - factory/contract.py
    - docs/agent-army/CURRENT_STATE.md
  prior_art:
    - "ISO/IEC 9646 (1991) conformance testing"
    - "ITU-T Z.140 (07/2001) TTCN-3 clause 24.2, Table 20 — monotone overwriting: none < pass < inconc < fail < error"
    - "ETSI ES 201 873-1, current maintained edition (same material at clause 24.1 / Table 30)"
  prior_art_status: known_prior_art
  prior_art_note: >-
    NOT this repository's invention, and the corpus corrected itself in public on this point.
    The mapping is one-to-one: PASS<->pass, FAIL<->fail, UNMEASURABLE<->inconc, NOT_RUN<->none.
    ERROR was MISSING until 2026-08-31 (commit ba57f66) and its absence was found by an adversarial
    refutation pass in the sibling repo, not by internal review.
  maturity: measured
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/contract.py:32 Verdict enum; ContractResult.verdict checks ERROR before FAIL; ERROR is in UNSCORED_VERDICTS; tests/test_contract.py:68 guards against sweeping declared inconclusiveness into ERROR"
  related_concepts: [C-VD-02, C-VD-03, C-EV-01, C-EV-02]
  dependencies: []
  proposed_benefits:
    - "a dark instrument cannot read as healthy"
    - "an apparatus failure cannot be reported as a subject failure"
  proposed_metrics:
    - "count of UNMEASURABLE verdicts, reported separately from FAIL, never summed"
  unresolved_questions:
    - "⚠ FIVE IN THE ENUM, SIX IN EFFECTIVE USE: REFUSED (evaluator_service/service.py:62) is a verdict to the client but is not a Verdict member. CURRENT_STATE.md judges the separation may be correct, and leaves it open."
    - "⛔ `Unmeasurable` is defined THREE SEPARATE TIMES with three different docstrings — contract.py, readiness.py:42, schedule.py:54. UNRESOLVED."

- concept_id: C-VD-02
  name: A zero from an instrument nobody proved could see is not a measurement
  aliases: [instrument_live, blind instrument, the blind-grep class]
  description: >-
    Before publishing "none / never / zero", demonstrate the instrument would have registered a
    non-zero in that window. Report ZERO / NOT-RECORDED / NOT-VISIBLE / NOT-RETAINED as distinct
    verdicts; collapsing them is how a measurement gap becomes a claim about the world.
  source_documents:
    - docs/protocol/METRICS.md
    - docs/findings.d/F84-the-zero-consumer-count-was-measured-by-a-blind-grep.md
    - docs/findings.d/F94-six-gates-reported-pass-over-an-empty-population-and-four-cited-no-evidence.md
    - docs/findings.d/F96-a-search-on-the-wrong-field-returned-zero-and-two-duplicate-tasks-were-created-on-the-strength-of-it.md
    - docs/findings.d/F86-the-findings-ledger-could-not-see-its-own-last-eight-findings.md
    - docs/evidence/marketing-model-v1/R1-stakeholder-evidence.md
  maturity: measured
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: >-
    factory/reliability.py Rate.__str__ prints "⚠ [instrument NEVER seen to register a non-zero]";
    tests/test_recurrence_preflight.py carries the negative control proving the counter CAN register
    a green; tests/test_gates_refuse_an_empty_population.py; tests/test_gate_negative_control_census.py
  related_concepts: [C-VD-01, C-VD-04, C-EV-03, C-PR-02]
  dependencies: [C-VD-01]
  proposed_benefits:
    - "a false negative from a broken tool cannot be reported as an absence in the world"
  proposed_metrics:
    - "instrument_live boolean carried beside every rate"
    - "count of gates whose population is empty"
  unresolved_questions: []
  measured_incidence: >-
    SEVEN of the thirty-three findings in docs/findings.d/ are instances of this single class:
    F72, F75, F84, F86, F91, F94, F96. It is the corpus's most frequently rediscovered defect.

- concept_id: C-VD-03
  name: Every figure carries its basis
  aliases: [MEASURED/DERIVED/ASSUMED, basis labelling, evidence tiers]
  description: >-
    Each stated number carries a label saying how it was obtained. The corpus uses several
    overlapping vocabularies for this and has not unified them (see contradictions.md CN-08):
    MEASURED / DERIVED / ASSUMED (factory/tasks.py:137); MEASURED / DERIVED / REASONED / BET
    (architecture-v0); OBSERVED / DOCUMENTED / MARKETED (R8 §7 for external claims);
    RECORDED / RECONSTRUCTED / NOT-RECORDED (factory/runs.py:42).
  source_documents:
    - docs/specs/architecture-v0.md
    - factory/tasks.py
    - factory/runs.py
    - docs/research/R8-data-engineering-agent-factory.md
    - docs/evidence/marketing-model-v1/D1-requirements-and-uncertainty.md
  maturity: implemented
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/tasks.py:137 basis on every evidence row; factory/runs.py:42 basis on every run row"
  related_concepts: [C-VD-02, C-VD-04, C-EV-06]
  dependencies: []
  proposed_benefits: ["a stale claim cannot wear a measurement's label unnoticed"]
  proposed_metrics: ["share of published figures carrying a basis label"]
  unresolved_questions:
    - "⛔ four incompatible basis vocabularies coexist and no document maps them onto each other. R17 §16.12 maps its own tiers onto the estate's, which is the only mapping that exists."

- concept_id: C-VD-04
  name: Counts must carry their own regeneration command
  aliases: [regenerable counts, no hand-typed numbers]
  description: >-
    Never state a count in a document unless the command that produced it is stated beside it. A
    hand-maintained number re-rots every time and the re-rot is invisible because the number still
    looks authoritative.
  source_documents:
    - docs/evidence/marketing-model-v1/D1-requirements-and-uncertainty.md
    - docs/agent-army/CURRENT_STATE.md
    - docs/evidence/recurrence-preflight-2026-08-31/README.md
    - docs/research/agent-factory-concept-inventory.md
  maturity: implemented
  research_status: settled
  implementation_status: PARTIAL
  implementation_evidence: "practised in the newer evidence documents; NOT enforced by any test"
  related_concepts: [C-VD-02, C-VD-03]
  dependencies: []
  proposed_benefits: ["counts stop drifting silently"]
  proposed_metrics: ["share of stated counts accompanied by a command"]
  unresolved_questions:
    - "the concept-inventory's own gate count drifted from 27 to 30 within one document, and was corrected in place. Nothing prevents recurrence."

# ================================================================================================
# B · AGENT — DEFINITION, CONFIGURATION, COGNITION
# ================================================================================================

- concept_id: C-AG-01
  name: The configuration IS the version
  aliases: [config-as-identity, content-derived version id, agent as a tuple]
  description: >-
    An agent is not a name — it is a (prompt, model, effort, tools, retry policy, turn cap, budget)
    tuple. Change any element and it is a different agent, whose certification does not transfer.
    The version id is a hash of the config, so a silent upgrade cannot inherit a guarantee nobody
    re-checked.
  source_documents:
    - factory/blueprint.py
    - docs/research/agent-factory-concept-inventory.md
    - docs/research/answers/R2-answer-topology.md
    - docs/raw_research/agent-config-research-pack/02-configuration-and-storage.md
  maturity: measured
  research_status: settled
  implementation_status: IMPLEMENTED
  implementation_evidence: "factory/blueprint.py AgentSpec/TeamSpec with content-derived version ids; factory/readiness.py VERSION_DIMENSIONS + g_version_hash_is_complete"
  related_concepts: [C-AG-02, C-AG-03, C-EV-05, C-GV-04]
  dependencies: []
  proposed_benefits: ["a certification cannot silently transfer across a configuration change"]
  proposed_metrics:
    - "version-hash completeness: how many of the declared dimensions the hash actually covers"
  unresolved_questions:
    - "⛔ R2 named NINE version dimensions the hash misses (SYNTHESIS §3.4). architecture-v0 §8 records 6 of 15 covered, 9 absent."
    - "⛔ F90 (OPEN): TeamSpec.repo is INSIDE the version hash and NOTHING READS IT — the inverse defect. A field in the identity that has no effect."
    - "⭐ SYNTHESIS §15.1: g_version_hash_is_complete could never pass, because of a U+0008 character in its regex. The gate measuring this concept was itself broken."

- concept_id: C-AG-02
  name: The four-layer agent model
  aliases: [genotype/phenotype/history/fitness, Agent Genome]
  description: >-
    An agent is described in four separate layers. GENOTYPE — mutable declarative configuration
    (model profile, reasoning strategy, context policy, memory policy, tool permissions,
    communication phenotype, initiative/escalation policy, budgets, skill bindings, authority,
    safety constraints). PHENOTYPE — observed mission behaviour (message frequency, verbosity,
    initiative events, clarification count, disagreement rate, tool strategy, planning depth,
    recovery, delegation, latency, cost). HISTORICAL STATE — append-only measurements.
    FITNESS/READINESS — derived, mission-conditioned metrics.
  source_documents:
    - docs/raw_research/agent_factory_agent_genome_research_pack/01_CURRENT_DESIGN_SYNTHESIS.md
    - docs/raw_research/agent_factory_agent_genome_research_pack/schemas/agent_genome.schema.yaml
    - docs/raw_research/agent_factory_rd_consolidation_pack/02_AGENT_GENOME.md
    - docs/raw_research/agent_factory_agents_as_configuration_research_pack/02_CONCEPTS/AGENT_PHENOTYPE_AND_PRESETS.md
  maturity: designed
  research_status: not_researched
  implementation_status: NOT_IMPLEMENTED
  implementation_evidence: "factory/blueprint.py implements the genotype layer only. No phenotype, historical-state or fitness layer exists."
  related_concepts: [C-AG-01, C-AG-03, C-AG-04, C-AG-06, C-OP-03]
  dependencies: [C-AG-01, C-AG-03]
  proposed_benefits:
    - "prevents a giant YAML becoming an accidental source of truth for history and telemetry"
    - "makes an agent comparable across mission classes"
  proposed_metrics: ["capability fit, recent reliability, domain freshness, context readiness, tool/environment readiness, communication compatibility, team complementarity, risk/trust score, expected quality/cost/latency"]
  unresolved_questions:
    - "no evidence that the phenotype layer's fields predict anything"
    - "no definition of how a phenotype is measured from a transcript"

- concept_id: C-AG-03
  name: The five field classes
  aliases: [TUNABLE/DECLARED/MEASURED/DERIVED/POLICY, field classification]
  description: >-
    Every configuration field carries exactly one class. TUNABLE — a candidate for simulation or
    search. DECLARED — fixed identity or contract. MEASURED — an append-only observation. DERIVED —
    computed from evidence. POLICY — human- or institution-governed, never automatically mutated.
    The stated purpose is to stop one YAML file becoming an accidental source of truth for
    history and telemetry at once.
  source_documents:
    - docs/raw_research/agent_factory_agent_genome_research_pack/01_CURRENT_DESIGN_SYNTHESIS.md
    - docs/raw_research/agent_factory_agent_genome_research_pack/schemas/field_classification.yaml
  maturity: designed
  research_status: not_researched
  implementation_status: NOT_IMPLEMENTED
  related_concepts: [C-AG-01, C-AG-02, C-OP-04, C-GV-04]
  dependencies: []
  proposed_benefits:
    - "the optimizer's legal search space becomes a property of the schema rather than of a convention"
    - "a safety-specification field cannot be mutated by a search"
  proposed_metrics: ["count of fields per class; count of TUNABLE fields the optimizer is actually permitted to touch"]
  unresolved_questions:
    - "who assigns the class, and what happens when a field's class should change?"
  cross_reference_note: >-
    ⭐ THIS CONCEPT AND SYNTHESIS §6's "never optimise" LIST ARE THE SAME IDEA REACHED
    INDEPENDENTLY. §6 names retry caps, gate thresholds, tenancy checks, timeouts, evaluator
    thresholds and the corpus as "safety specification, not hyperparameters" — that is exactly the
    POLICY class. Neither document cites the other. This convergence is the strongest argument in
    the index for adopting the five classes.

- concept_id: C-AG-04
  name: Agent registry and agent lockfile
  aliases: [AgentVersion, certification, resolved config lockfile]
  description: >-
    A registry analogous to a package registry — AgentDefinition + skills + model profile + tool set
    + policy + eval suite -> AgentVersion -> Certification -> AgentLockfile. A mission run records
    the exact config hash and dependency versions.
  source_documents:
    - docs/raw_research/agent_factory_agent_genome_research_pack/01_CURRENT_DESIGN_SYNTHESIS.md
    - docs/raw_research/agent-config-research-pack/00-executive-assessment.md
    - docs/raw_research/agent-config-research-pack/configs/resolved-config.lock.example.json
  prior_art: ["Nix/Guix lockfiles", "Kubernetes CRD + controller pattern", "package registries generally"]
  prior_art_status: adaptation
  maturity: designed
  research_status: not_researched
  implementation_status: PARTIAL
  implementation_evidence: "factory/blueprint.py hashes config; factory/registry.py distinguishes proven/declared/unbuilt workflows. There is no lockfile, no certification object and no dependency pinning."
  related_concepts: [C-AG-01, C-AG-03, C-EV-05, C-GV-04]
  dependencies: [C-AG-01, C-AG-03]
  proposed_benefits: ["exact reproduction of a run's configuration", "certification bound to a resolved artifact rather than a name"]
  proposed_metrics: ["share of runs whose configuration can be exactly reconstructed"]
  unresolved_questions:
    - "what is in the lock: the agent config only, or the whole environment? R4 treats environment reproducibility as the expensive part."

- concept_id: C-AG-05
  name: Agent phenotype presets and communication phenotypes
  aliases: [Quiet/Loud/Mumbler, Concise Scout, Challenger, Coordinator, behavioral policy profile]
  description: >-
    UI-friendly personality labels compiled into measurable parameters. Quiet — low unsolicited-
    message probability, high novelty threshold, high batching. Loud — high initiative, high
    broadcast tendency, low escalation threshold. MUMBLER is explicitly not a preset but a DETECTED
    ANTI-PATTERN (low semantic density, high ambiguity, weak commitments). Also Concise Scout,
    Challenger, Coordinator. The simulation system should DISCOVER which phenotype fits which
    mission and topology rather than assuming one is universally best.
  source_documents:
    - docs/raw_research/agent_factory_agent_genome_research_pack/01_CURRENT_DESIGN_SYNTHESIS.md
    - docs/raw_research/agent_factory_agent_genome_research_pack/presets/communication_phenotypes.yaml
    - docs/raw_research/agent-config-research-pack/00-executive-assessment.md
  maturity: designed
  research_status: not_researched
  implementation_status: NOT_IMPLEMENTED
  related_concepts: [C-AG-02, C-CM-05, C-TM-04, C-SM-01]
  dependencies: [C-AG-02, C-CM-01]
  proposed_benefits: ["team chemistry stops being hidden in prompts"]
  proposed_metrics: ["message frequency, information density, initiative events, disagreement rate"]
  unresolved_questions:
    - "no multi-agent run has ever executed here, so the denominator for every phenotype metric is zero"
  preservation_note: >-
    KEPT DESPITE BEING UNUSUAL. The renaming discipline in agent-config-research-pack — metaphor to
    engineering primitive — is what makes this tractable: "personality" becomes "bounded behavioral
    policy profile", "army rank" becomes three separate fields (authority grade, competency grade,
    operational role).

- concept_id: C-AG-06
  name: Agent health vector and mission requirement vector
  aliases: [readiness as a match, Agent Health Vector, Mission Requirement Vector]
  description: >-
    Readiness is not a property of an agent — it is the MATCH between an agent health vector and a
    mission requirement vector. Health must not become a single opaque score without decomposition.
  source_documents:
    - docs/raw_research/agent_factory_agents_as_configuration_research_pack/02_CONCEPTS/MISSION_READINESS_AND_READY_UP.md
    - docs/raw_research/agent-factory-bootstrap-pack/docs/07-implementation/FEATURE_INTEGRATION_SEEDS.md
    - docs/raw_research/agent-config-research-pack/04-team-metrics-and-formulas.md
  maturity: idea
  research_status: not_researched
  implementation_status: NOT_IMPLEMENTED
  implementation_evidence: "factory/readiness.py measures readiness OF THE FACTORY, not of an agent or capability (CURRENT_STATE.md: PARTIAL)"
  related_concepts: [C-AG-07, C-TM-04, C-EV-04]
  dependencies: [C-AG-02]
  proposed_benefits: ["mission-specific readiness rather than blind metric maximisation"]
  proposed_metrics: ["readiness delta between current health and mission requirement"]
  unresolved_questions:
    - "which health dimensions actually predict mission success? R-HEALTH-01 in the bootstrap pack's queue asks exactly this and is unrun."

- concept_id: C-AG-07
  name: Pre-deployment readiness uplift (READY-UP)
  aliases: [last-minute skill-up, mission conditioning, readiness boost]
  description: >-
    Before deployment, compare mission requirements to current readiness and recommend BOUNDED
    interventions — context refresh, targeted retrieval, tool check, micro-eval, skill loading, a
    temporary specialist attachment. A mission-specific readiness delta is preferable to blindly
    maximising every metric.
  source_documents:
    - docs/raw_research/agent_factory_agents_as_configuration_research_pack/02_CONCEPTS/MISSION_READINESS_AND_READY_UP.md
    - docs/raw_research/agent-config-research-pack/configs/presets/predeployment-readiness-uplift.yaml
    - docs/raw_research/agent-factory-bootstrap-pack/docs/07-implementation/FEATURE_INTEGRATION_SEEDS.md
  maturity: designed
  research_status: not_researched
  implementation_status: NOT_IMPLEMENTED
  related_concepts: [C-AG-06, C-KN-04, C-SI-03]
  dependencies: [C-AG-06]
  proposed_benefits: ["higher first-pass success without permanently enlarging every agent"]
  proposed_metrics: ["measured before/after readiness state; first-pass success with vs without uplift"]
  known_risks:
    - "⛔ THE CORPUS CONTRADICTS ITSELF HERE. agent-config-research-pack lists 'artificially increasing all health scores before deployment' under ideas that must NOT be implemented literally: 'this corrupts the instrument. The system may improve readiness and forecast uplift, but health moves only after measurement.' See contradictions.md CN-04."
  unresolved_questions:
    - "how is an uplift's effect attributed, given the agent also changed?"

- concept_id: C-AG-08
  name: Viable Cognitive Entity
  aliases: [VCE, Agent 2.0, the entity after the standard agent]
  description: >-
    A persistent computational entity that maintains and improves its own ability to operate,
    described by a self-model plus cognition plus health plus trust plus development — as opposed to
    a task-only agent that exists for the duration of a request.
  source_documents:
