# Corpus manifest — the Agent Factory / Agent Team / Agent Army research corpus
#
# GENERATED BY: a corpus-preparation pass, 2026-09-02, against agent-factory @ fc78074 (branch main).
# PURPOSE: an indexing and classification layer OVER the existing corpus. It moves, merges,
#          rewrites and deletes nothing. Every source artifact remains where it was.
#
# ------------------------------------------------------------------------------------------------
# READ THIS BEFORE USING ANY FIELD
# ------------------------------------------------------------------------------------------------
#
# 1. This manifest is INTERPRETATION. The source documents are EVIDENCE. Where they disagree, the
#    source wins and this file is the thing that needs correcting.
#
# 2. `implementation_status` in this file is a claim about THIS manifest's reading. The repository
#    already holds two instruments that outrank it, and both cite file:line:
#       docs/agent-army/CURRENT_STATE.md   — what of the Agent Army vocabulary exists in code
#       .agent-platform/RECONCILIATION.md  — what of the bootstrap pack already exists here
#    Where this manifest and either of those disagree, THEY are right. They were measured against
#    code; this was measured against documents.
#
# 3. `unknown` and `not_determinable` are real values and are used deliberately. Nothing here is
#    filled in by inference. A field that could not be established from the repository is absent
#    or `unknown`, never guessed.
#
# 4. Dates. `first_committed` is the date of the commit that ADDED the file to git
#    (`git log --diff-filter=A`). For the inbound research packs under docs/raw_research/ this is
#    the IMPORT date, not the authoring date — those packs were generated elsewhere and the
#    repository holds no record of when. Those records carry
#    `creation_date_basis: import_date_not_authoring_date`.
#    `first_committed: untracked` means the file exists on disk and is not in git.
#    `first_committed: gitignored` means it is deliberately excluded from git (see .gitignore).
#
# 5. Record depth is tiered, and the tier is stated on each record as `record_tier`:
#      full    — every applicable field populated. Used for load-bearing artifacts.
#      compact — identity, type, topic, status and relations populated; interpretive fields only
#                where the document actually supports them. Used for member files of the inbound
#                research packs, whose value is collective rather than individual.
#      bundle  — one record covering a directory of homogeneous artifacts (render screenshots,
#                probe dumps). The bundle record names the file count and the grain.
#    Tiering is a reading-cost decision, not a judgement about worth. No artifact is omitted
#    because it was judged unimportant; omissions are listed in `coverage.not_indexed` below.
#
# ------------------------------------------------------------------------------------------------

