# ------------------------------------------------------------------------------------------------
# F · THE FINDINGS LEDGER — docs/findings.d/ + docs/findings.md
#
#     One file per finding. Four mandatory fields (BELIEVED / ACTUALLY / MEASURED BY / AFFECTS) and
#     three optional ones (KIND / CHANGES / STATUS). factory/findings.py reads them AS DATA so a lane
#     is shown only the corrections that hit it — these are executable documents.
#
#     KIND and STATUS below were MEASURED 2026-09-02 by parsing the files, not transcribed.
#     Ids F22-F69 do not exist: the README reserves id blocks per lane (control-plane F20-F29,
#     certify F30-F39, judgement F40-F49, artifact F50-F59, grain F60-F69, non-lane sessions F70+)
#     and most blocks were never filled.
# ------------------------------------------------------------------------------------------------

