    - "STATUS: OPEN / ADOPTED / REJECTED / SUPERSEDED — silence has to mean DECIDED"
    - "design_debt() lists every DESIGN/AGENT-DESIGN finding still OPEN. That is the list that should shrink."
    - "closing a lane with nothing to add is still an entry: write NOTHING TO REPORT"
  architecture_areas_affected: [memory, governance, communication]
