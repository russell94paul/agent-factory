# ------------------------------------------------------------------------------------------------
# Field vocabulary
# ------------------------------------------------------------------------------------------------
vocabulary:
  type:
    - vision                 # states intent; is not a specification and is not evidence
    - origin_record          # verbatim recovered source material
    - specification          # says what should be built, in this repository's own terms
    - protocol               # a contract between agents or between stages
    - schema                 # a machine-readable structure definition
    - research_prompt        # a question written to be dispatched
    - research_answer        # a returned answer, filed raw
    - research_source        # third-party or unfiled source material kept verbatim
    - synthesis              # reconciliation across answers; the decision record
    - finding                # a corrected premise, with a discriminating test
    - evidence               # a measurement record with a reproduction command
    - review                 # an adversarial read of this repo's own work
    - design_proposal        # a proposed architecture, not decided
    - implementation_plan    # sequence, phases, tickets
    - boot_prompt            # a session handoff
    - artifact               # a rendered deliverable (HTML)
    - mission                # a scoped unit of delivery work with a contract
    - blueprint              # an agent/team configuration that IS a version
    - corpus_fixture         # hashed known-good data an assertion is scored against
    - index                  # a navigation or manifest document
    - inbound_pack           # externally generated material imported wholesale
    - operational_record     # board, tickets, ledgers rendered as data
  evidence_quality:
    - MEASURED               # a number obtained by running something, with the command stated
    - DERIVED                # computed from something measured
    - REPLAYED               # scored against a recorded corpus, not a live run
    - REASONED               # an argument from constraints, no measurement
    - EXTERNAL_CITED         # rests on an external source the document cites
    - EXTERNAL_UNVERIFIED    # rests on an external source nobody checked back to source
    - ASSERTED               # stated without a basis
    - AI_GENERATED_UNVERIFIED # produced by a model, no independent corroboration
    - NOT_APPLICABLE
  implementation_status:
    - IMPLEMENTED            # exists, is imported, and is covered by a test
    - PARTIAL                # a mechanism exists and is cited; the concept as written is not built
    - STUB
    - DESIGN_ONLY            # the document itself says nothing is built
    - RESEARCH_ONLY
    - REJECTED_ON_EVIDENCE   # built or specified, then refused with a measurement
    - NOT_IMPLEMENTED
    - NOT_APPLICABLE
    - UNKNOWN
  currency:
    - CURRENT                # nothing found that supersedes or contradicts it
    - CURRENT_WITH_CORRECTIONS # still governing, but carries in-place corrections
    - STALE                  # a later document or the code contradicts it
    - SUPERSEDED             # explicitly replaced, and the replacement is named
    - HISTORICAL             # deliberately kept as a record of what was believed
    - UNKNOWN

