  topic: the findings ledger contract
  subtopics: [why a directory, the title line, the four mandatory fields, the three optional fields]
  concepts_introduced:
    - "⭐ separate paths cannot conflict — worktree isolation is a feature, so the ledger cannot be one mutable file"
    - "the TITLE LINE decides whether the file is read at all: three hashes, the id, an em dash. A fragment the parser cannot split is invisible to load(), and it does not warn."
    - "STATUS must be the LAST field — a field's value runs to the end of its block"
    - "KIND: CORRECTION / INSTRUMENT / DESIGN / AGENT-DESIGN / PROCESS"
