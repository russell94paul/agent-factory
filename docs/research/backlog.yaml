- research_id: RB-09
  title: An evaluation protocol for organizational and agent-team designs
  type: EXPERIMENT_DESIGN
  priority: HIGH
  objective: >-
    C-OR-03 proposes that organization presets are versioned candidates so organizational design
    becomes empirical, and supplies NO METHOD. The zeus pack supplies a graduation rule with core
    metrics, a baseline task suite, target thresholds and a prototype ladder — written for UI
    concepts. Nothing connects them.
  research_questions:
    - What is the baseline task suite for an organizational comparison in this estate?
    - What thresholds must a candidate beat, stated before any candidate exists?
    - How is the Goodhart risk handled (the zeus pack's Gate 7 names it and gives no mechanism)?
    - What sample size makes a difference between two structures detectable?
  owns: "the protocol for comparing organizational or team designs"
  must_not_answer: ["which topology wins (RB-04)", "which health metrics to use (RB-07)"]
  source_concepts: [C-OR-03, C-TM-02, C-EV-09]
  source_documents: [docs/raw_research/zeus_world_ui_research_pack/05_EVALUATION_PROTOCOL.md, docs/raw_research/zeus_world_ui_research_pack/09_IMPLEMENTATION_READINESS.md, blueprints/orchestrator_team.yaml, docs/research/SYNTHESIS.md]
  addresses_gaps: [GAP-15]
