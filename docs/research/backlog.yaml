    about prompt injection; the lethal trifecta survives it intact" — and absorption-backlog AB-09
    notes that a sandbox move was adopted partly on isolation grounds. If the sandbox does not
    address the actual threat, the justification is wrong even if the move is right.
  research_questions:
    - What threat classes does a container with an egress allowlist actually defend against, for an agent with warehouse credentials?
    - What survives it, and what would defend against those?
    - Is the ephemeral clone a compromised oracle at the layer the evidence rule protects (R17 §16.3)?
    - What is the cheapest control that defends against the threat that matters most here?
  owns: "the threat model for agent isolation"
