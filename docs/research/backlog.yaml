- research_id: RB-10
  title: Near-miss capture in high-reliability organisations
  type: PRIOR_ART
  priority: MEDIUM
  objective: >-
    A successful mission can still carry a safety lesson, and this estate currently records none.
    At least three near misses exist in the corpus as prose only — for example
    docs/evidence/live-probes-a1-a5 §6, "a trap this session walked into and backed out of" — and
    none is in any ledger, so none is retrievable.
  research_questions:
    - How do aviation, healthcare and industrial safety define and capture a near miss?
    - What triggers capture without relying on self-report? (an agent asked "did anything nearly go wrong?" will answer no)
    - What is the minimum record that makes a near miss retrievable and actionable?
    - What is the measured yield — do near-miss programmes actually reduce incidents?
  owns: "near-miss capture as a mechanism"
  must_not_answer: ["failure classification (built, factory/preflight.py)", "the findings ledger's schema (built)"]
  source_concepts: [C-AG-15, C-KN-01, C-KN-05]
  source_documents: [docs/raw_research/agent2_sihre_consolidation_pack/03_agent2_concept_registry.md, docs/findings.d/README.md]
  high_leverage_concepts: [HL-12]
  dependencies: []
  expected_outputs: ["a capture-trigger design", "a minimal near-miss record shape compatible with findings.d/"]
  architecture_components_affected: [memory, findings ledger]
  unblocks_implementation_decisions: ["whether the findings ledger gains a fifth KIND"]

- research_id: RB-11
  title: Error correlation between agent configurations
  type: EXPERIMENT_DESIGN
  priority: MEDIUM
  objective: >-
    The only proposal in the corpus offering a MECHANISM for why a team might beat a single agent:
    select by expected utility AND error covariance, so diversity reduces correlated failure rather
    than merely adding members. R2's evidence is that the naive version does not help.
  research_questions:
    - What is the prior art on ensemble error correlation, and does it transfer to LLM agents?
    - How is failure-vector covariance measured over a small number of runs?
    - ⭐ What is the cheapest version — do two presets that differ in model and effort fail on the same things?
    - What sample size would make a covariance estimate meaningful?
  owns: "error correlation as a team-composition criterion"
  must_not_answer: ["whether to build a team — DEFERRED", "topology fit (RB-04)"]
  source_concepts: [C-AG-11, C-TM-01, C-TM-04]
  source_documents: [docs/raw_research/agent2_sihre_consolidation_pack/05_quantitative_agent2_features.md, docs/raw_research/agent2_sihre_consolidation_pack/research_prompts/DR02_COGNITIVE_PORTFOLIO_THEORY.md, docs/research/answers/R2-answer-topology.md]
  addresses_gaps: [GAP-20]
  high_leverage_concepts: [HL-07]
  dependencies: [RB-00C]
  expected_outputs: ["a measurement protocol", "a cheap first experiment needing two runs, not an architecture"]
  architecture_components_affected: [team composition, evaluation]
  unblocks_implementation_decisions: ["whether 'evidence a tier helps' is reachable cheaply"]
  note: >-
    ⭐ Reframes the multi-agent question usefully: not "should we build a supervisor tier" but "do
    two configurations of the same agent fail on the same things?" — which needs two runs.

