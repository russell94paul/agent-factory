    independent gates each with a quantified unlock (README.md + SYNTHESIS §6) encode the same
    discipline in different shapes. Neither cites the other; no document compares them.
  research_questions:
    - Which representation is harder to game?
    - Does an ordered ladder impose a false total order on independent capabilities?
    - What does the safety and autonomy literature use, and why?
    - Can the two be composed — a ladder for communication, a table for gating?
    # ⓘ ADDED 2026-09-02 by the .agent-platform delta pass:
    - >-
      Can rank be a DERIVED UI PROJECTION over independent gates — LOCKED / EXPERIMENTAL /
      PROVISIONAL / EARNED — without imposing a false total order and without creating a second
      source of truth? MEASURED this pass: factory/readiness.py holds 30 gates across 5 phases
      (judgement 8, certification 8, handover 7, bounded 4, loop 3) with NO order between phases,
      while AUTONOMY_LADDER.md specifies 8 strictly ordered ranks each with a required proof; and
      `grep -rniE "LOCKED|EXPERIMENTAL|PROVISIONAL|EARNED" factory/*.py` finds no such vocabulary.
      ⛔ platform-progress.schema.json (currentRank/ranks/updatedAt) is the parallel PROGRESS file
      factory/roadmap.py refuses on principle; the mission must not recommend it.
  owns: "the representation of staged autonomy"
  must_not_answer: ["what the individual unlock conditions should be"]
  source_concepts: [C-TM-02, C-GV-02, C-SI-01, C-EV-04, C-EV-05]
  source_documents: [.agent-platform/bootstrap/ROADMAP_TO_VISION.md, .agent-platform/bootstrap/docs/AUTONOMY_LADDER.md, .agent-platform/bootstrap/schemas/platform-progress.schema.json, .agent-platform/bootstrap/skills/roadmap-rank-tracker/SKILL.md, README.md, docs/research/SYNTHESIS.md, docs/research/answers/R7-answer-session-manager.md]
  addresses_gaps: [GAP-21, GAP-23]
  addresses_contradictions: [CN-02, CN-23]
