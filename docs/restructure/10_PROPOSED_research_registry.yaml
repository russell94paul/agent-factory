      "Cell Genome" = 7/3; "Configuration Genome" = 1/1; and "Cell Image" = 4/3, which v3 omits.
      The canonical ontology already carries a single heading "Cell Blueprint / Cell Genome"
      defining them as ONE concept (the declarative versioned source spec), with "Cell Image"
      separately defined as the resolved immutable deployment artifact — a real distinction,
      not a collision.
      ⭐ And the anchor is a FILENAME, not an API: factory/blueprint.py exposes TeamSpec and
      AgentSpec, nouns that appear in no CELL OS design document and are the only names in the
      family with running code and tests.
    required_decision: >
      Pick ONE name for the declarative spec (Blueprint | Genome); keep Cell Image as the resolved
      artifact; state the mapping to TeamSpec/AgentSpec; retire Configuration Genome (1 occurrence).
      "Do not introduce a fourth synonym" arrives when there are already five names in play.

