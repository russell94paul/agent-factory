      model and uses Federation — but never says it is doing so, and v0.1 remains in the corpus
      asserting the opposite. Requires marking v0.1 section 5 superseded.
    note: "The former TD-1 (Operative Cell versus Cell) is now TD-10; the former TD-2 (blueprint family) is now TD-7. Numbering follows document 14 section 7, the authoritative record."

  - id: TD-2
    decision: "Federation layer name"
