# GreenContract target — windsorai @ CLIENT-A
#
# The first real contract instance. Chosen because windsorai landed its first row ever on
# 2026-08-20 (20 rows, one session id, verified at the consumer layer) after ten attempts and
# zero completions. A contract first exercised on a broken connector cannot tell "the connector
# is broken" from "the contract is wrong", so it is calibrated here, against known-good.
#
# Every field carries its basis. A field marked ASSUMED has not been measured and is a question
# for a human, not a default to build on.

connector: windsorai
client: CLIENT-A

# MEASURED — orchestrator run 2026-08-20, flow run `responsible-pigeon`
landing_table: QA_DG1_GEP_PREFECT_PR.WINDSORAI__PR.google_ads_CAMPAIGN
session_column: ___ALDC___GLOBAL_SESSION_ID___
run_date: "2026-07-22"

# DERIVED — the estate's deployment naming is "<connector> - <client>", measured for
# `amazon_ads - CLIENT-A`. Confirm against `prefect deployment ls` before a live run.
deployment: "windsorai - CLIENT-A"

# DERIVED from connector/connectors/windsorai.py naming convention. Not yet read from source.
connection_class: WindsorAiConnection
options_class: WindsorAiOptions

# MEASURED — PR #50 merged as 4db9556 at 09:46:51Z; :development republished 09:50:18Z.
expected_commit: "4db9556"
merged_at: 1787305611          # 2026-08-20T09:46:51Z

# ⚠ INCOMPLETE — the recorded digest is truncated to 19 characters in the evidence
# (`sha256:d2d7193bc096ae149`). A4 matches byte-for-byte, so this must be re-measured from the
# registry before it can be pinned. Left empty: A3 then proves import + commit + build-time and
# does not pretend to prove the digest.
expected_image_digest: ""

# ASSUMED — no pinned test revision exists yet. 721 passed on 2026-08-20, but pinning a count
# is wrong the moment a test is added.
pinned_test_revision: ""

expect_rows: true

# DERIVED from the Google Ads campaign grain. Confirm against the table DDL.
primary_key: [account_id, campaign_id, date]
key_column: account_id
date_column: date
non_null_positive: [spend]

# DERIVED — sourced 2026-08-21 from prefect-connectors
# connector/accounts/CLIENT-A/deployments/windsorai.py:23, which declares what the flow REQUESTS.
# That distinction is the whole point: this list is the requested scope, not the observed
# landing. Reading it out of landed rows would make completeness unfalsifiable — the exact hole
# the calibration matrix caught in A9.
#
# Its own provenance, quoted from that file: "CLIENT-A's Windsor-authorized Google Ads accounts
# (GP-226, verified 2026-05-29: an unfiltered team-key pull returns 45 Google accounts, of which
# these 6 are CLIENT-A's)". One ALDC Windsor key returns EVERY client's accounts — 45 of them — so
# an unfiltered pull lands CLIENT-B rows in a CLIENT-A table and nothing downstream can tell.
#
# ⚠ STALENESS, carried deliberately. Verified 2026-05-29, ~12 weeks before this blueprint, and
# the source file itself says "Confirm against a live pull before activation." A12 now has a
# declared scope to test against, which is a real improvement over having none — but a PASS on
# A12 means "the landing matched what we declared", not "what we declared is still correct".
# Re-confirm against a live account list before certifying anything for promotion.
tenant_column: account_id
allowed_tenants:
  - "389-957-4788"   # Brinno
  - "842-825-0313"   # Bridgford
  - "126-436-3882"   # bigsostore
  - "524-661-7349"   # Cibu
  - "703-152-5903"   # Slobproof
  - "232-341-9629"   # CLIENT-A-Amazon

# ⚠ SHAPE CORRECTION. These are DASH-formatted, which is how Windsor emits `account_id` for
# this source. The calibration corpus was pinned with placeholder ids commented "real shape
# (10-digit Google Ads)" — that comment was wrong about the shape. The corpus is not edited to
# match, because it replays what a run recorded and nobody has measured which accounts actually
# landed; inventing them would be fabrication. calibration_target() overrides allowed_tenants
# from the corpus, so calibration stays self-consistent and this list governs live runs only.
#
# ⛔ STILL NOT MEASURED — Meta/Facebook. The same source file records 3 CLIENT-A accounts
# authorized in Windsor (of 19 returned unfiltered) whose literal ids were never written down,
# and holds `REPLACE_BEFORE_ACTIVATION_SEE_TODO` in their place. That placeholder is good
# design, not an oversight: it matches nothing, so the flow lands zero rows rather than silently
# mixing in another client's. This blueprint covers the Google Ads flow only.
