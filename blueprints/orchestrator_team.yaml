# ⛔ SUPERSEDED BY EVIDENCE 2026-08-21 — DO NOT BUILD THIS TEAM.
#
# R2 (docs/research/answers/R2-answer-topology.md) was asked whether this three-agent design is
# defensible. It is not, and the answer was unusually direct: "Start with one end-to-end
# implementation agent, not the three-agent architect -> implementer -> tester team."
#
# The recommended first topology has NO LLM manager, NO LLM architect, NO LLM tester and NO
# agent-to-agent channel:
#
#     control plane -> ONE worker agent (inspect, plan, implement, self-test, repair)
#                   -> non-LLM VERIFIER in a clean environment, immutable contract
#                   -> control plane -> privileged operation? -> HUMAN
#
# The worker plans and tests inside one continuous context but CANNOT author the authoritative
# PASS bit. "Prefect is the manager in the only sense that presently matters: it owns state."
#
# Why: a 180-configuration study across 5 architectures, 3 model families and 4 agentic
# benchmarks found multi-agent averaging -3.5% against single-agent baselines, with sequential
# tasks degrading 39-70%. Connector migration is sequential shared-state work — the class that
# did worst. Anthropic's 90.2% multi-agent result is breadth-first research at ~15x the tokens,
# and their own guidance says coding is less parallelisable. And our own measured failures were
# ALL seam failures, so adding two mandatory LLM-to-LLM handoffs treats the wrong variable.
#
# ⚠ CORRECTED 2026-08-31 by Wave 0 (agent-army-research). THE DECISION BELOW STANDS. The
# argument above was stronger than its evidence, and a decision record must not overstate.
#
#   * The -3.5% carries a 95% CI of [-18.6%, +25.7%] and sigma=45.2%. A mean whose interval
#     spans zero is NOT evidence that multi-agent hurts on average. The interval IS stated at
#     docs/research/answers/R2-answer-topology.md:15 — it was dropped on the way into this file.
#   * The same study found a centralised system IMPROVED a parallelisable financial task by
#     +80.9%. The effect is task-structure dependent in BOTH directions.
#   * R2 labels it "OPEN RESEARCH, not production infrastructure evidence".
#   * The figures above are v1. The paper is arXiv:2512.08296, now v3 (8 Apr 2026):
#     260 configurations, six benchmarks, R^2 fallen 0.513 -> 0.373. v3 leads with
#     architecture-task fit, not an average -- "+80.8% on decomposable financial reasoning
#     to -70.0% on sequential planning".
#   * Peer-reviewed as Nature Machine Intelligence 8(7):1157-1172,
#     doi:10.1038/s42256-026-01268-y, and RETITLED "Capable language models can outgrow the
#     benefits of collaboration". Capability saturation is what survived review.
#
# What actually carries this decision: the SEQUENTIAL degradation (-70.0% in v3, the pole named
# in the paper's own abstract, and the class connector migration belongs to), plus our own
# all-at-the-seams failures. Quote R2-answer-topology.md or the paper -- never this header's
# mean. Verification: agent-army-research/research/sources/W0-citation-verification-partial.md
#
# THIS FILE IS KEPT, NOT DELETED. It is a hypothesis that was tested and rejected, and the
# rejection is worth more than the file's absence would be. R2 also gives the threshold that
# would unlock it — a same-budget A/B on the same connector tasks and the same authoritative
# verifier showing >=10pp absolute terminal-success gain, or >=20% lower cost at
# indistinguishable success, with no increase in side effects and every mandatory handoff
# >=99% accepted-and-correctly-consumed. Those are governance thresholds, not published
# constants.
#
# Do not instantiate these three agents. Build the single-worker topology first.
# ---------------------------------------------------------------------------------------------

# The first and only team. It works ON the orchestrator repo.
#
# Two levels, one topology. A supervisor tier is added when there is a second team AND evidence
# that coordination between them is the bottleneck - not before.
name: orchestrator-team
purpose: >
  Harden the orchestrator so it can run unattended: retire false-success paths, serve the
  logbook, and make one connector provably green end to end.
topology: manager_to_agent
contract: connector-green
repo: prefect-connectors
prohibition: >
  Must not deploy to production, must not modify the eval corpus, and must not raise its own
  attempt cap. Each of those is a human decision.

agents:
  - name: architect
    role: Turn a request into staged work with an evidence gate on every stage.
    model: opus
    effort: high
    max_turns: 40
    budget_usd: 5.0
    prohibition: Must not write implementation code. A planner that implements is not planning.
    prompt: |
      You plan. You do not implement. Produce staged work where every stage names the evidence
      that proves it done, and the discriminating test whose result you predicted BEFORE running.

  - name: implementer
    role: Make the change in an isolated worktree.
    model: sonnet
    effort: medium
    max_turns: 60
    budget_usd: 8.0
    prohibition: Must not mark its own work green. The tester holds the contract.
    prompt: |
      Implement exactly the staged work handed to you. Match the surrounding code's idiom.
      When blocked, write the blocker to the task store - do not invent a workaround.

  - name: tester
    role: Run the GreenContract and report the verdict, including UNMEASURABLE.
    model: sonnet
    effort: high
    max_turns: 40
    budget_usd: 5.0
    prohibition: >
      Must not report PASS when an instrument could not run. UNMEASURABLE is a distinct verdict
      and it is not a pass.
    prompt: |
      Run the contract. Report PASS, FAIL, UNMEASURABLE or NOT_RUN per assertion. Prove the test
      fails without the fix before you claim it passes with it.
