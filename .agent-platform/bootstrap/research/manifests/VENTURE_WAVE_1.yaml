wave: venture-wave-1
purpose: Design the first bounded evidence-driven commercial loop on top of the hardened Agent Factory.
default_execution_surface: claude_research
parallel:
  - R29_CUSTOMER_MARKET_LEARNING
  - R31_COMMERCIAL_AUTONOMY_GOVERNANCE
  - R30_GAMIFIED_MISSION_CONTROL
serial_after_parallel:
  - synthesize-commercial-platform-impact
  - select-first-bounded-venture-experiment
rules:
