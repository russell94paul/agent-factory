# Client Review narrative — Navira cross-channel marketing model
#
# ⛔ This file is NOT a system of record. It is the client-facing *wording* for state that lives
#    in `.data/tasks.jsonl` and `.data/missions/marketing-model-reconstruction-v1.json`.
#    `factory.client_review` checks every `evidence_refs` entry against the real filesystem and
#    the real task-evidence rows; a claim whose evidence does not resolve is downgraded to
#    UNSUBSTANTIATED here, not published as fact.
#
# ⭐ `origin:` is load-bearing. CLIENT means the client asked for it. FACTORY_PROPOSED means we
#    are suggesting it. R1 found that most of the "design" in the record is ALDC-authored rather
#    than client-requested, so conflating the two is the specific failure this field prevents.

project:
  id: marketing-model-reconstruction-v1
  name: Navira Cross-Channel Marketing Model
  client: GEP
  # Client-facing subtitle, directly under the H1. The internal disambiguation it used to
  # carry ("GEP is ... the Jira project") named our issue tracker to the client.
  subject: Navira is the entity being modelled; GEP is the contracting client

review:
  status: In delivery — reconstruction phase
  last_review_at: null   # no prior client review; this is the first

intent:
  objective: >-
    Establish one agreed, evidence-backed definition of the Navira cross-channel marketing model —
    what it must answer, at what grain, from which data — before any further build work is
    committed to it.
  requested_outcome: >-
    A recommended dimensional design for cross-channel marketing measurement, with the reasoning
    and the evidence behind each choice visible, ending in a recommendation you sign off.
  requirements:
    - Read-only against your systems. No client state is modified at any point in this phase.
    - Every requirement traced to who actually said it — you, or us on your behalf.
    - The design must state its grain explicitly before any measure is designed.
    - An absence in the data must never render as a zero.
  assumptions:
    # ⭐ LECTRIC moved out of this list on 2026-09-01 by operator decision. It was previously
    #    stated here as in scope, which D4 had already falsified — see `exclusions` below. The
    #    only entity in target-state scope is Navira.
    - Navira (HOUSE) is the entity the target-state model is being designed for.
    - Work targets the TEST environment; production is not read or written in this phase.
  exclusions:
    # The existing `exclusions` slot carries this, deliberately. The repository has no scope
    # status constant — `grep -rn 'DE_SCOPED\|de-scoped' factory/` returns nothing — and one was
    # not invented to hold a single decision. The contract already had a field for "not in scope".
    - >-
      Lectric is not part of the target-state model. It exists in the estate today and appears in
      the historical record, and this phase does not remove it — it excludes it from the model
      being designed. Its historical values are therefore not carried forward as part of the
      future model, and they should not be read as if they were.
    - >-
      The known defect in Lectric's metric path is not a repair requirement for the target-state
      model, and no fix for it is proposed or costed here. It is recorded as a property of the
      current estate, not as work this design owes you.
    - No changes to the existing Power BI model or the marketing dashboard during reconstruction.
    - No production deployment in this phase.
  acceptance_criteria:
    - Requirements are separated into what you confirmed, what we inferred, and what is unresolved.
    - Each candidate design declares its grain and is tested against the questions it must answer.
    - A named human signs off the recommendation before any build work follows from it.
  unresolved_ambiguities:
    - >-
      The boundary between daily reporting metrics and marketing metrics rests on a recollection
      of a request, not on a record of one. Reading the meeting transcript did not support it.
      This needs your confirmation — see Decisions.
    - >-
      Ten referenced tickets and several email threads are not readable from our repositories, so
      any requirement resting only on those is recorded as reported-to-us, never as confirmed.
    # ⛔ The honest half of the Lectric decision. Excluding something from a design is not the
    #    same act as removing it from a running system, and this review must not let the first
    #    be read as the second.
    - >-
      Taking Lectric out of the target-state model is a scope decision, not a change to your live
      systems. Nothing has been removed. The order in which it could safely be removed, and which
      existing consumers would be left pointing at nothing if it were, have not been verified —
      that work is not part of this phase and is not being claimed as done.

progress:
  current_stage: Understanding
  milestones:
    - { title: "Reconstruct what was asked for", task: R1 }
    - { title: "Diff the written record against the code", task: R2 }
    - { title: "Map the available marketing data", task: R3 }
    - { title: "Synthesise requirements", task: [D1, D2] }
    - { title: "Candidate designs and skeptical review", task: [D3, D4] }
    - { title: "Recommendation and sign-off", task: D5 }

delivered:
  - id: D-R1
    task: R1
    title: What you actually asked for, reconstructed from primary sources
    origin: CLIENT
    status: Complete
    summary: >-
      A claim-by-claim ledger of the requirements on this model, each marked with who said it and
      how strongly the record supports it — your own words, an internal paraphrase, something we
      inferred from your data, or an assumption with no source.
    business_impact: >-
      You can see which parts of the current design you actually requested and which parts we
      chose on your behalf, before committing further budget to either.
    evidence_refs:
      - docs/evidence/marketing-model-v1/R1-stakeholder-evidence.md

  - id: D-R1a
    task: R1
    title: A long-standing open question on the metric boundary has been settled against the record
    origin: CLIENT
    status: Complete
    summary: >-
      The split between daily reporting metrics and marketing metrics was recorded as resting on a
      recollection, with a note that it should be confirmed against the meeting transcript before
      going further. That confirmation had never been done. We have now read the transcript in
      full: it does not contain that request. It contains a different, more specific one.
    business_impact: >-
      A design decision that has shaped the model for months turns out not to be traceable to
      anything you said. Correcting it now is cheap; discovering it after the rebuild is not.
    evidence_refs:
      - docs/evidence/marketing-model-v1/R1-stakeholder-evidence.md

  - id: D-R2
    task: R2
    title: The written record checked line-by-line against the working code
    origin: FACTORY_PROPOSED
    status: Complete
    summary: >-
      Every documented claim about the model was re-checked against the two source repositories:
      14 hold, 11 are out of date, 23 are documented nowhere, and 8 pieces of prior design work
      already exist and were being overlooked.
    business_impact: >-
      Stops the redesign re-deriving work that already exists, and stops it inheriting eleven
      statements that are no longer true of the running system.
    evidence_refs:
      - docs/evidence/marketing-model-v1/R2-repo-wiki-diff.md

  - id: D-R2a
    task: R2
    title: Confirmed that your dashboard and your Power BI reports do not share a data path
    origin: FACTORY_PROPOSED
    status: Complete
    summary: >-
      The marketing dashboard reads the warehouse directly; the Eclipse app reads Power BI. They
      are separate routes to separately-defined objects — and for a period they were reading
      objects with the same names and different contents. Four of those have since been corrected;
      six have not.
    business_impact: >-
      Explains how the same metric can legitimately differ between the two surfaces you look at,
      and identifies exactly which six objects can still disagree today.
    evidence_refs:
      - docs/evidence/marketing-model-v1/R2-repo-wiki-diff.md

  - id: D-R3
    task: R3
    title: A measured map of the marketing data you actually have
    origin: FACTORY_PROPOSED
    summary: >-
      We read the marketing estate directly rather than working from its documentation, using an
      access identity created for the purpose and proved read-only before a single figure was
      taken — it was watched refusing a write. What it found: 84 marketing objects across 7
      separate areas, carrying 34 distinct names, with the central marketing activity table
      existing in five copies. Each advertising channel starts on a different date, so any figure
      spanning all of them is comparing periods that do not overlap.
    business_impact: >-
      Duplication on this scale is the reason two reports can both be "right" and still disagree.
      Knowing the real shape — and that the copies are not identical — is what makes the rest of
      the work a repair rather than a rebuild.

  - id: D-D1
    task: D1
    title: Your requirements, separated from what we inferred on your behalf
    origin: CLIENT
    summary: >-
      Every requirement on this model is now labelled with how strongly it is supported: your own
      words, a contemporaneous document, something we measured, something we reasoned to, or
      something believed with no source at all. Where two sources disagree the disagreement is
      carried forward rather than settled quietly. Seven gaps are named explicitly, including one
      that matters more than the rest — the dimensions table describing your brands, portfolios,
      ad types and targeting has never arrived, so no design can claim to be complete on those
      axes. We also confirmed, rather than assumed, that no sign-off exists on any part of this
      model to date.
    business_impact: >-
      You can see which parts of the current model you asked for and which we chose for you,
      before any further budget goes into either. A requirement with no source is a decision
      someone made without telling you, and there are some.

  - id: D-D2
    task: D2
    title: The questions the model must be able to answer, and who has to answer each one
    origin: FACTORY_PROPOSED
    summary: >-
      Before designing anything we wrote down the questions the model has to be able to answer —
      44 in total — and, for each one, what changes depending on the answer. Each is labelled with
      whose question it actually is: something you asked for, a constraint the data imposes, a
      choice we made internally, or a decision only you can take. That separation is the point.
      Several questions we had been treating as things to ask you turned out to be our own naming
      and design choices, which we should resolve ourselves rather than bring to you.
    business_impact: >-
      It shortens your list. Work that looks like it needs your input often does not, and the
      questions that genuinely do need you are worth more of your time once the rest are cleared
      out of the way.

  - id: D-D3
    task: D3
    title: Candidate designs, each declaring its grain before it was drawn
    origin: CLIENT
    summary: >-
      Three candidate designs were produced, with the level of detail each row represents written
      down and committed before any design work began, so the answer could not be shaped to fit
      the preferred conclusion. The finding was not that one candidate beat the others. It was
      that the underlying structure is sound — the existing level of detail is both correct and
      minimal, verified on the exact copy your dashboard reads — and that the problems live in
      naming, definitions and delivery rather than in the shape of the data. Four of our own
      standards of proof were unmet when the candidates were first scored; three of those were
      then measured rather than waived, and the fourth was carried into the review stage.
    business_impact: >-
      The cheapest possible answer to "the model needs rebuilding" is that it does not. That
      conclusion is only worth having because it was tested rather than assumed, which is what the
      next item did.

  - id: D-D4
    task: D4
    title: We tried to break the leading design before recommending it
    origin: FACTORY_PROPOSED
    summary: >-
      The recommendation was attacked across nine specific ways a model of this kind fails —
      double counting, lost detail, a gap shown as a zero, filters nobody can see, figures that
      cannot be reconciled, and others. It survived, with one amendment: one new conformed
      reference table for marketplaces is needed, because today several parts of the system each
      build their own version of that list. The review also overturned five claims made by the
      design stage itself, which is why it exists. Two things it found are worth your attention.
      Your dashboard and your Power BI reporting do not see the same advertising population — one
      channel is present in one and absent from the other — and the dashboard adds amounts in
      three different currencies as though they were one. Separately, a correct fix made earlier
      to stop missing data being shown as zero has the side effect of blanking a group of derived
      return-on-spend figures across most of the reporting history, which then display as zero at
      the far end.
    business_impact: >-
      Two reports disagreeing about advertising spend is not a reporting preference; it is two
      different answers to the same question, and until now neither surface said so. These are
      correctable without rebuilding anything, and they are the difference between numbers you can
      quote and numbers you have to caveat.

  - id: D-D5
    task: D5
    title: The recommendation, and the three decisions that are genuinely yours
    origin: CLIENT
    summary: >-
      The recommendation is to keep the existing marketing structure, add an explicit contract for
      what each measure means, point the dashboard at the agreed source, and add one shared
      marketplace reference table. No new central table is proposed. Nine specific repairs are
      listed, each naming the problem it closes and how that problem was measured. The list of
      things we need from you has been reduced to three: which quantity the phrase "advertising
      cost" should mean, whether the calibrated return-on-spend figure should be capped, and which
      of the return-on-spend measures should be the headline — that last one to be put to you only
      once we have enumerated the set properly, because the number of them we have previously
      quoted could not be reproduced.
    business_impact: >-
      The expensive option was never necessary. What is needed is agreement on meaning and one
      delivery change, which is a smaller and far more reversible commitment than a rebuild — and
      it turns three open questions into three decisions you can actually make.

evidence:
  - id: E-1
    type: analysis
    label: Stakeholder claim ledger — every requirement, with who said it
    source: docs/evidence/marketing-model-v1/R1-stakeholder-evidence.md
    summary: >-
      Claims graded CONFIRMED (your own words or a contemporaneous minute) · SUPPORTED (one
      internal record paraphrases you) · INFERRED (we derived it from your data) · ASSUMPTION
      (no citable source) · UNKNOWN. Sources that we cannot read are listed explicitly rather
      than guessed at.
  - id: E-2
    type: analysis
    label: Record-versus-code diff — 14 locked, 11 stale, 23 undocumented, 8 prior designs
    source: docs/evidence/marketing-model-v1/R2-repo-wiki-diff.md
    summary: >-
      Each finding cites the file and line it was read from. Includes the six warehouse objects
      still resolving to a divergent copy, and the four already repointed.

decisions:
  - id: DEC-1
    question: >-
      Should the model keep the current split between daily reporting metrics and marketing
      metrics — and if so, on what basis?
    context: >-
      This split has been treated as your requirement. Re-reading the meeting transcript in full,
      we cannot find you asking for it. We found a different and more specific request instead.
      Rather than quietly keeping a rule we cannot source, we would like you to settle it.
    blocking: true
    origin: CLIENT
    recommendation: >-
      Replace the unsourced split with the specific request the transcript does contain, and
      record it as a confirmed requirement going forward.
    options:
      - "Adopt the requirement the transcript actually records (recommended)"
      - "Keep the current split, and we record it as an ALDC design decision rather than your requirement"
      - "Neither — tell us the rule you want and we record it as confirmed from this meeting"
    status: OPEN
    delivery_impact: >-
      Blocks requirements synthesis, which every subsequent design task depends on. No effect on
      the work already delivered.

  - id: DEC-2
    question: >-
      Do you want the six remaining divergent warehouse objects repointed now, or as part of the
      model rebuild?
    context: >-
      Six objects the dashboard reads still resolve to a second copy with different contents from
      the one Power BI reads. Four equivalents were corrected previously. Until these six are
      repointed, the two surfaces can legitimately show different numbers for the same metric.
    blocking: false
    origin: FACTORY_PROPOSED
    recommendation: >-
      Repoint them as part of the model rebuild, so the change is made once against an agreed
      design rather than twice.
    options:
      - "Repoint as part of the rebuild (recommended)"
      - "Repoint now as a separate corrective change"
      - "Leave as-is and document the difference"
    status: OPEN
    delivery_impact: >-
      No effect on the current delivery date either way. Repointing now would add a separate
      validation cycle.

risks:
  - id: RISK-1
    title: Two of your surfaces can still report different numbers for the same metric
    severity: HIGH
    origin: FACTORY_PROPOSED
    impact: >-
      Six warehouse objects read by the marketing dashboard resolve to a different copy from the
      one Power BI reads. Where those copies differ, the same named metric can differ between the
      dashboard and the Eclipse app. One previously-identified case was missing a five-figure sum
      of Amazon spend.
    mitigation: >-
      All six are identified by name in the evidence. Repointing is a small, reversible change;
      the open question is only when to make it — see the second decision above.
    owner: ALDC
    client_action_required: true

  - id: RISK-2
    # The risk is entirely about whether R3 has been able to run. Linking it means the review
    # stops asking for a decision the task store shows was already reached.
    task: R3
    title: Data mapping was held up by internal access, and has since completed
    severity: LOW
    origin: FACTORY_PROPOSED
    impact: >-
      Mapping what marketing data exists, and at what grain, could not begin until an access
      question on our side was resolved, and the requirements and design work all sat behind it.
      That is no longer the position: the mapping ran, and every task that was waiting on it has
      since completed.
    mitigation: >-
      Rather than widen an existing account, we created a dedicated read-only identity for the
      work and confirmed it could not write before taking a single figure — it was watched
      refusing a write. The delay cost the schedule some time and cost the evidence nothing.
    owner: ALDC
    client_action_required: false

  - id: RISK-3
    title: Part of the requirement record is not readable by us, and is graded accordingly
    severity: MEDIUM
    origin: FACTORY_PROPOSED
    impact: >-
      Ten referenced tickets, several Jira comment threads and two email threads are cited in our
      internal record but are not in any repository we can read. Requirements resting only on
      those are recorded as reported-to-us, never as confirmed by you.
    mitigation: >-
      Every such claim is listed explicitly in the evidence rather than being silently upgraded.
      The fastest resolution is to confirm or correct them directly in the review meeting.
    owner: ALDC
    client_action_required: true

next:
  - id: N-1
    task: R3
    title: Map what marketing data exists, at what grain, and where it disagrees
    dependency: Internal credential rotation
  - id: N-2
    task: D1
    title: Synthesise the confirmed requirements, separated from what we inferred
    dependency: The data map, and your answer on the metric boundary
  - id: N-3
    task: D2
    title: Catalogue the analytical questions the model must be able to answer
    dependency: Requirements synthesis
  - id: N-4
    task: D3
    title: Produce candidate dimensional designs, each declaring its grain first
    dependency: The question catalogue
  - id: N-5
    task: D4
    title: Attempt to falsify the leading design before recommending it
    dependency: Candidate designs
  - id: N-6
    task: D5
    title: Recommendation, with a named human sign-off
    dependency: Skeptical review

acceptance:
  status: READY_FOR_REVIEW
  notes: >-
    This is a review of the reconstruction phase, not of the finished model. Acceptance of the
    recommendation comes at the end of the design phase.
