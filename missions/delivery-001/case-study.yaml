patterns:
  - id: P1
    name: KNOWLEDGE_AVAILABLE_BUT_NOT_CONSUMED
    statement: >-
      The knowledge existed, in our own record, and the next actor did not consume it. Not a
      knowledge problem — an operationalisation problem. A sentence is not a mechanism.
    issue_ids: [H1, H2, M-05, M-07, M-13]
    count: 8
    note: >-
      8 of 37 issues across the full record. The Artifact Generator design process reproduced it
      (M-13), which is the strongest available evidence that filing knowledge does not make it act.

  - id: P2
    name: ABSENCE_RENDERED_AS_A_NUMBER
    statement: >-
      A missing measurement rendered as a value. The estate already knows the rule and enforces it
      structurally — for exactly one measure.
    issue_ids: [H12, H15, M-01]
    count: 5
    note: The counter-example is the argument — one measure got NULL-not-zero and nothing generalised it.

  - id: P3
    name: CLAIM_WITHOUT_AN_AS_OF
    statement: Each was true when written. None carried the date it was true, or the source it was true of.
    issue_ids: [H2, H3]
    count: 6
    note: The remedy is one field, not a system. factory/context.py already has it.

  - id: P4
    name: OBLIGATION_WRITTEN_IN_PROSE
    statement: We wrote the obligation down ourselves, in our own words, and nothing enforced it.
    issue_ids: [H16, H19, M-07, M-09]
    count: 5
    note: >-
      The cheapest and most under-built capability. Four of five are one sentence away from being a
      task with an owner and a dependency edge, and TaskStore.block already works.

