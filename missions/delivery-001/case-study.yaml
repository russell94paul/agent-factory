        label: The plan was never materialized. Create the tasks
        consequence: Two duplicate tasks with no dependency edges. Wave 1 runs under the wrong ids.
        was_actual: true
      - key: B
        label: Run a positive control — search for something you know is in the store
        consequence: You discover the field you filtered is the task ID, which is hex. No id contains "R1".
        was_actual: false
      - key: C
        label: Check the mission JSON, which lists the ids
        consequence: The labels block maps R1 to its id directly. Ten seconds.
        was_actual: false
      - key: D
        label: Ask someone
        consequence: Slower, and the answer is on disk.
        was_actual: false
    actual_outcome: >-
      A. Two duplicate tasks created at 02:13:52Z — 81 minutes and 38 seconds after the tasks it
      could not find were created.
    later_evidence: >-
      All eight tasks existed, correctly parented, with a fully wired DAG and 25 block events. The
      correction came 3,611 seconds later; the store is append-only so both duplicates were
