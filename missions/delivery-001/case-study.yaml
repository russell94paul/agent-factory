lessons:
  - id: L-1
    observation: >-
      Previous failure evidence existed and later actors did not consume it — eight of thirty-seven
      issues. In the sharpest case a defect class was fixed in the morning and the identical class
      was committed against a credential file that afternoon.
    root_cause: KNOWLEDGE_AVAILABLE_BUT_NOT_CONSUMED — execution history is stored and not operationalised
    capability: Known-Failure Preflight (new mechanism; the knowledge base exists today)
    change: >-
      A shape matcher at task launch — task shape maps to matching prior findings, and the specific
      guard is shown AND required. Seed it with three proven shapes: a deny-list over a credential
      source, a zero from an unproven instrument, an unqualified object reference.
    measurement: Known-failure recurrence rate per mission
    baseline: "2 (the blind zero and the deny-list)"
    target_002: >-
      0. A repeated known failure should never occur without the later run having been shown the
      prior evidence and having declined the guard explicitly.

  - id: L-2
    observation: >-
      Five obligations were written down by us, in our own words, and none was enforced — a
      confirmation marked not done, a ratio movement that must be announced, a hold with no owner,
      a scope item never read, and thirteen instrumentation fields never written.
    root_cause: MISSING_TASK_OR_DEPENDENCY — a sentence carries no state, no owner and no blocking power
    capability: Intent Contract (absent, measured) on top of TaskStore.block (existing and proven)
    change: >-
      Any spec sentence of obligation shape becomes a task with an owner, a next-check date and a
      dependency edge. The mission cannot close over an open obligation.
    measurement: Obligations declared in a mission spec versus obligations materialised as tasks
    baseline: "5 declared, 0 materialised"
    target_002: 100% materialised, or explicitly waived with a reason recorded in the store

  - id: L-3
    observation: >-
      Thirteen per-task instrumentation fields were specified and none written; and the acceptance
      check claiming three parallel sessions is not satisfied by the record, exactly as the spec
      warned it could pass over an absence.
    root_cause: INSTRUMENTATION_GAP — the instrument was specified in prose and never built
    capability: Reliability instrumentation (partial — the run ledger already draws three verdicts)
    change: >-
      A task-execution event carrying start, end, model, effort, retries and outcome. The task
      contract refuses to close without an actual, exactly as it already refuses without evidence.
    measurement: Percentage of tasks with a RECORDED actual, and acceptance checks demonstrated rather than asserted
    baseline: "0% actuals; 2 of 5 acceptance checks demonstrated"
    target_002: 100% recorded actuals; every acceptance check demonstrated or labelled as able to pass over an absence

  - id: L-4
    observation: >-
      Two claims were inherited into the mission. The one marked "verify" was refuted at escape
      distance 1 and never became mission knowledge. The one not marked propagated into a filed
      spec and had to be challenged by a human.
    root_cause: STALE_CONTEXT — with the mechanism's effectiveness shown by the contrast
    capability: Typed Claims (partial — factory/context.py already carries the temporal half)
    change: >-
      Promote the five-level client-claim vocabulary from prose convention to type. Inheriting a
      claim across a session boundary requires a verification state.
    measurement: Claims inherited across a session boundary with no verification state
    baseline: "1 of 2"
    target_002: 0

  - id: L-5
    observation: >-
      The spec named a scope item AND predicted the exact failure of missing it. The worker recorded
      that scope as unreachable. Nothing reconciled the two, and the artefacts it named were read by
      nobody.
    root_cause: MANUAL_HANDOFF — prose cannot enforce itself, however precisely it predicts its own failure
    capability: Typed Handoff with ACK/NACK (new)
    change: >-
      Scope becomes a typed list. The worker ACKs or NACKs each item. A task cannot close with an
      item carrying neither, and a NACK is a legitimate answer that becomes a visible gap.
    measurement: Scope items with neither an ACK nor a NACK, per task
    baseline: "at least 1"
    target_002: 0

  - id: L-6
    observation: >-
      Five issues are the same defect — an absence rendered as a number — and the estate already
      enforces the correct rule structurally for exactly one measure.
    root_cause: SEMANTIC_CONTRACT_GAP — a rule enforced by convention at one site instead of by type at every site
    capability: Semantic Contracts (partial — the review projection already keeps four absence states distinct)
    change: >-
      Extend the four-state absence model from the review projection down into the field contract.
      A contracted field with no resolvable source renders NOT_REPORTED and cannot render a literal.
    measurement: Contracted fields rendering a literal with no source
    baseline: "at least 12"
    target_002: 0 in any client-facing surface the Factory publishes
