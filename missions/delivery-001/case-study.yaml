    context: >-
      You are designing the Artifact Generator. The forensic record shows six issues where a claim
      was true when written and false when re-used. You need a temporal contract.
    information_available:
      - The repo has ~50 modules in a flat factory/ package
      - No module name obviously suggests temporal claims
      - The need is clear and the design is straightforward to write
    question: What do you do?
    choices:
      - key: A
        label: Design a TemporalAssertion dataclass — the need is well understood
        consequence: >-
          You add a parallel vocabulary beside one that already exists, and the two drift. This is
          the failure family the case study names as its largest.
        was_actual: true
      - key: B
        label: Inventory the existing modules for an equivalent contract first
        consequence: >-
          factory/context.py has status, confidence, a required source and a checked date — and
          refuses to call a ref CURRENT without one.
        was_actual: false
      - key: C
        label: Ask whether anyone remembers a similar contract
        consequence: Depends on who is available and what they recall.
        was_actual: false
      - key: D
        label: Build it and reconcile later
        consequence: Later never has a scheduled date.
        was_actual: false
    actual_outcome: >-
      A. A TemporalAssertion contract was fully designed and written into the architecture proposal
      before an inventory sweep found the existing one.
    later_evidence: >-
      context.py:109 refuses CURRENT without a checked date, and its docstring states the
      invariant — UNVERIFIED is the default, not a weak CURRENT. The contract was deleted from the
      proposal and replaced with a ~25-line additive extension. The correction is recorded in the
      proposal rather than quietly applied.
    impact:
      technical: A duplicate contract avoided; three live consumers not forked
      client: None — internal design work
      company: >-
        The design process for the tool that documents this failure family reproduced the failure
        family. That is the strongest available argument for making filed knowledge act, and the
        weakest possible argument that the automation already exists.
      kpi_ref: K-14
    evidence_refs: ["docs/case-studies/delivery-001-marketing-model.md#sec-k"]
    counterfactual:
      capability: Known-Failure Preflight
      strength: MAY_REDUCE_LIKELIHOOD
      maturity: PROPOSED
      expected_effect: >-
        MANUAL INVENTORY INTERCEPTED. A human sweep caught this at escape distance 0. A future
        automated preflight may reduce the likelihood of the next one; it cannot be credited with
        this one, and no current code supports a stronger classification.
      remaining_human: Running or reading the inventory, and judging equivalence
      confidence: LOW that automation would have caught this specific case

