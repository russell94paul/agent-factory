    question: Do you build it?
    choices:
      - key: A
        label: Yes — two independent documents agree
        consequence: You build the thing that was rejected the next day.
        was_actual: false
      - key: B
        label: Check for a later decision on the same question before opening either
        consequence: A ticket dated one day later rejects the shape explicitly, with a specific reason.
