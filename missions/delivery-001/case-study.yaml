  - id: SC-7
    order: 6
    step_ref: T-A9
    title: The headline metric, upside down
    context: >-
      You are writing the specification for the board-level marketing-efficiency number. You open
      the architecture page that locks it.
    information_available:
      - The page states the formula twice, consistently
      - It is the decision record, and it names a decision date and an owner
      - You have not opened the implementation
    question: Do you specify the formula as the document states it?
    choices:
      - key: A
        label: Yes — it is the locking document and it says so twice
        consequence: You ship a spec whose headline metric is the reciprocal of the running system's.
        was_actual: false
      - key: B
        label: Check the implementation before specifying from the doc
        consequence: The monthly view computes the inverse.
        was_actual: true
      - key: C
        label: Pick whichever looks more sensible
        consequence: Both ~5.0 and ~0.2 are defensible-looking numbers.
        was_actual: false
      - key: D
        label: Preserve the contradiction and escalate it as a decision
        consequence: Slower. Correct.
        was_actual: false
    actual_outcome: >-
      B, then D. Three implementations were found that agree with each other and disagree with the
      document — the SQL, the field contract, and the frontend at two separate lines.
    later_evidence: >-
      The document's own formula is what the same page elsewhere calls a different metric's shape.
      The error is not random: a definition migrated into its neighbour's slot. The contradiction
      was preserved rather than resolved, and it is recorded as CONTRADICTORY, not fixed.
    impact:
      technical: Nothing was ever built wrong. The code has been right throughout
      client: A ~5.0 and a ~0.2 are the same business fact; the board would see one of them
