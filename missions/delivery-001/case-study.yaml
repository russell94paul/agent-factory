scenes:
  - id: SC-1
    order: 1
    step_ref: T-B1
    title: The premise you were handed
    context: >-
      You have been told to run the first real mission using Agent Factory's existing
      mission/task/DAG/state/claim mechanisms.
    information_available:
      - The repo has a factory/ package with ~50 modules
      - The instruction sounds authoritative and came from a reviewer whose job is to improve the plan
      - Nothing yet suggests a problem
    question: The plan names four mechanisms. What do you do first?
    choices:
      - key: A
        label: Start building against the four named mechanisms
        consequence: >-
          Two do not exist. lanes.py validates lane gate ids at import, so the first lane fails at
          import time and the session is spent debugging a plan rather than running it.
        was_actual: false
      - key: B
        label: Ask the reviewer to clarify
        consequence: Costs a round trip. The reviewer does not have the repo open.
        was_actual: false
      - key: C
        label: Grep for each of the four names before planning against any of them
        consequence: "Two greps. `\\bmission\\b` -> no matches. `depends_on` -> no matches."
        was_actual: true
      - key: D
        label: Assume they exist under different names and adapt as you go
        consequence: The adaptation is invisible; nobody can tell later which parts of the plan were real.
        was_actual: false
    actual_outcome: >-
      Two greps, run before a task existed. board.DEPENDS turned out to be a gate dependency map,
      not a task DAG — but TaskStore already supplied the exact shape needed. Nothing new was built.
    later_evidence: >-
      The same pass corrected two more inherited premises: the subject is Navira, not GEP, and one
      task was already substantially done and was rescoped from reconstruct to read-and-diff.
    impact:
      technical: The plan was written against the system that exists rather than the one described
      client: None directly — but a mission planned against absent mechanisms delivers nothing
      company: The cheapest control in the entire case study. Two greps
      kpi_ref: K-14
    evidence_refs: ["docs/case-studies/delivery-001-marketing-model.md#scene-1"]
    counterfactual:
      capability: Provenance on inherited premises
      strength: WOULD_INTERCEPT
      maturity: PROPOSED
      expected_effect: An inherited premise carries who measured it and when, so it cannot be planned against unchecked
      remaining_human: Running the check
      confidence: HIGH — the manual version was observed working here

  - id: SC-3
    order: 2
    step_ref: T-B3
    title: The credential you are about to read
    context: >-
      A task needs Snowflake read access. Credentials live in a wiki vault file. A standing grant
      covers retrieval from this repo. You want the account and user, not the credential value itself.
    information_available:
      - The file contains live credential values and they must not enter the transcript
      - You have a filter in mind
      - A finding about guards being only as wide as the relation they derive over was fixed this morning
    question: How do you extract the account and user without extracting a credential value?
    choices:
      - key: A
        label: Deny-list — filter out every line naming the credential field
        consequence: >-
          The vault stores credentials in markdown tables. The word is in the header row and never
          in the data rows. Three plaintext values pass straight through.
        was_actual: true
      - key: B
        label: Allow-list only the account and user columns
        consequence: Nothing else can escape, including fields nobody has thought about yet.
        was_actual: false
      - key: C
        label: Read the whole file and be careful
        consequence: The value is in the transcript the moment it renders.
        was_actual: false
      - key: D
        label: Ask a human to paste just the account name
        consequence: Safe, slow, and the standing grant exists precisely to avoid this.
        was_actual: false
    actual_outcome: >-
      A. Three plaintext credential values reached the session transcript. One is listed for both the
      non-prod and the PRODUCTION account. Another was recorded as issued without MFA.
    later_evidence: >-
      A session manager indexes the first ~500 characters of the first ~16 messages into a
      substring-searchable table, and deletion does not stick. The exposure was around message 90 —
      probably outside that window. Probably is not verified. And the identical defect class was
      fixed in readiness.py that same morning.
    impact:
      technical: One credential spanning non-prod and production. Rotation owed and not confirmed
      client: None — the credential is ours, not the client's
      company: >-
        The rule became rule 1 of factory/client_review.py within a day — the client boundary is an
        allow-list, never a deny-list. The estate learning, expensively.
      kpi_ref: K-14
    evidence_refs: ["docs/case-studies/delivery-001-marketing-model.md#scene-3"]
    counterfactual:
      capability: Known-Failure Preflight
      strength: WOULD_BLOCK
      maturity: PROPOSED
      expected_effect: A deny-list filter over a credential source is refused before it runs
      remaining_human: None for the known shape
      confidence: HIGH — the knowledge existed in this repo hours earlier and nothing consumed it

  - id: SC-4
    order: 3
    step_ref: T-B4
    title: The read-only proof that cannot fail
    context: >-
      The mission spec requires proving read-only access by attempting a scoped write and watching
      it be refused. A role assumed read-only is an assumption; a role watched refusing is a
      measurement.
    information_available:
      - The available credential is an admin account in the TEST environment
      - TEST is recoverable, so a mistake is not catastrophic
      - The pre-flight is written and ready to run
    question: Do you run the pre-flight?
    choices:
      - key: A
        label: Run it — TEST is recoverable and the mission is read-only anyway
        consequence: The account is admin. It will not refuse. You record a pass from an instrument that cannot fail.
        was_actual: false
      - key: B
        label: Skip the pre-flight; the mission writes nothing
        consequence: An unproven assumption becomes an unwritten one.
        was_actual: false
      - key: C
        label: Run it and record read-only as ASSUMED, citing TEST recoverability as the compensating control
        consequence: Honest. Weaker. Still workable.
        was_actual: false
      - key: D
        label: Stop, and ask for a read-only role that structurally refuses
        consequence: Blocks the task on a human. Makes the pre-flight mean what it says.
        was_actual: true
    actual_outcome: >-
      The problem was spotted before the pre-flight ran, and both C and D were put to a human.
      D was chosen. The task blocked on creating a read-only role.
    later_evidence: >-
      The role was created and the refusal captured — R3 now carries
      R3-preflight-readonly-proof.md as MEASURED evidence. The vacuous version was refused; the
      real one was later performed.
    impact:
      technical: One blocked task, and one green light not manufactured
      client: None — and the client review said so in the client's own language
      company: The vacuous-verification shape this repo has met nine times, refused on the tenth
      kpi_ref: K-8
    evidence_refs: ["docs/case-studies/delivery-001-marketing-model.md#scene-4"]
    counterfactual:
      capability: Evidence requirements
      strength: WOULD_BLOCK
      maturity: EXERCISED
      mechanism_refs: ["factory/tasks.py"]
      exercised_proof: docs/evidence/marketing-model-v1/R3-preflight-readonly-proof.md
      expected_effect: >-
        The control worked without automation, and the automated half — close() refusing without
        MEASURED evidence — was watched refusing before the mission began.
      remaining_human: Choosing between the honest routes
      confidence: HIGH

  - id: SC-5
    order: 4
    step_ref: T-B6
    title: The search that returns zero
    context: You are about to run Wave 1. First, confirm the mission's tasks exist in the store.
    information_available:
