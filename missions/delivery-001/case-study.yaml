summary:
  - id: S-1
    issue: A design law built on a client request that was never made
    why: A recollection entered the record as a requirement; the doc flagged it unverified and nothing acted on the flag
    detected: Reconstruction audit, 8 weeks later
    ideal_interception: The moment the claim entered the record
    capability: Typed Claims + Evidence requirements
    benefit: Escape 5 to 0. A phantom requirement never reaches the client's ticket
  - id: S-2
    issue: The client's largest requirement has an unsent reply, and its bigger half never arrived
    why: A hold with no owner and no expiry
    detected: Reconstruction audit
    ideal_interception: At the hold
    capability: Intent Contract + Human Attention Router
    benefit: Designs cannot be produced against an unspecified dimension list without that being visible
  - id: S-3
    issue: Two of the client's surfaces read differently-defined objects with the same names
    why: Unqualified references resolving in a divergent schema copy
    detected: Chasing a $3,374.90 discrepancy; six objects still divergent
    ideal_interception: Before the first query against an unqualified name
    capability: Source Cartography
    benefit: Escape 2 to 0; the six-object backlog never accumulates
  - id: S-4
    issue: $244,870.44 of spend present in the warehouse and unselectable in the report
    why: Channel jammed into the marketplace axis, creating a non-member of the dimension
    detected: Lineage analysis
    ideal_interception: At the relabel
    capability: Semantic Contracts + Task DAG validation
    benefit: Cross-channel spend addressable by a positive slicer choice
  - id: S-5
    issue: The board headline metric is written backwards in the document that locks it
    why: A formula typed once, never reconciled to the implementation
    detected: Reconstruction audit
    ideal_interception: At the first implementation that chose a direction
    capability: Semantic Contracts
    benefit: Escape 4 to 1. Document and system stop disagreeing
  - id: S-6
    issue: A deny-list over a credential table exposed three credentials, one spanning production
    why: A guard only as wide as the relation it derives over — the same class fixed hours earlier
    detected: Same session, self-caught
    ideal_interception: Before the extraction
    capability: Known-Failure Preflight
    benefit: Three credentials not exposed; one production rotation not owed
  - id: S-7
    issue: A search filtered the wrong field, returned zero, and the zero became a finding
    why: No positive control on a search that returned nothing
    detected: Self-caught, 3,611 seconds later
    ideal_interception: At the search
    capability: Known-Failure Preflight (positive control)
    benefit: Escape 4 to 0. No duplicate tasks, no wrong provenance in the artifacts
  - id: S-8
    issue: "\"Three tasks ran in parallel\" is unproven by the record"
    why: Parallelism asserted in prose; three claims share one pid and R3 never claimed
    detected: This audit
    ideal_interception: At claim time
    capability: Reliability instrumentation
    benefit: The mission's headline claim becomes measurable rather than asserted

